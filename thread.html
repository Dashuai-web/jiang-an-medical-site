function qs(k) {
  var m = location.search.substring(1).split('&');
  for (var i = 0; i < m.length; i++) {
    var p = m[i].split('=');
    if (decodeURIComponent(p[0]) === k) return decodeURIComponent(p[1] || '');
  }
  return '';
}

var LOGIN_KEY = 'cm_forum_login';

  var mask = document.getElementById('loginMask');

  if (t) { t.style.display = 'block'; setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.style.display = 'none'; }, 700); }, 2400); }
}
