<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索结果 - 职场匿名区</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; font-size: 14px; color: #333; background: #f0f0f0; margin: 0; padding: 0; }
  .top { background: #2b579a; color: #fff; padding: 10px 0; }
  .top-inner { max-width: 860px; margin: 0 auto; }
  .logo { font-size: 18px; font-weight: bold; }
  .main { max-width: 860px; margin: 16px auto; background: #fff; border: 1px solid #ddd; }
  .panel-title { background: #f4f4f4; border-bottom: 1px solid #ddd; padding: 8px 14px; font-weight: bold; font-size: 13px; }
  .result-item { padding: 14px; border-bottom: 1px solid #eee; }
  .result-item:last-child { border-bottom: none; }
  .result-item .tag { display: inline-block; font-size: 11px; background: #e8eef7; color: #2b579a; padding: 1px 6px; margin-right: 6px; }
  .result-item .tag.banned { background: #f5e8e8; color: #a00; }
  .result-item a { color: #2b579a; text-decoration: none; font-size: 14px; font-weight: bold; }
  .result-item .desc { font-size: 12px; color: #888; margin-top: 4px; line-height: 1.7; }
  .no-result { padding: 30px; text-align: center; color: #999; font-size: 13px; }
  /* ---- login gate ---- */
  .login-mask { position: fixed; inset: 0; background: rgba(20,30,45,.92); display: none; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
  .login-mask.show { display: flex; }
  .login-card { background: #fff; padding: 30px 26px; max-width: 340px; width: 100%; text-align: center; border-radius: 4px; }
  .login-card h3 { margin: 0 0 10px; font-size: 17px; color: #2b579a; }
  .login-card p { font-size: 13px; color: #888; line-height: 1.8; margin: 0 0 18px; }
  .login-card button { padding: 9px 40px; background: #2b579a; color: #fff; border: none; border-radius: 3px; font-size: 14px; cursor: pointer; }
  .login-card .note { font-size: 11px; color: #bbb; margin-top: 12px; }
  .login-toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: rgba(30,40,55,.94); color: #fff; padding: 14px 30px; border-radius: 3px; font-size: 15px; letter-spacing: 1px; z-index: 100; display: none; transition: opacity .6s; }
  /* ---- mobile ---- */
  @media (max-width: 720px) {
    body { -webkit-text-size-adjust: 100%; }
    .top-inner, .topbar-inner, .nav-inner, .content, .main, .header, .search-inner, .box, .result-body { max-width: 100% !important; }
    .main { display: block !important; }
    .right, .side-col { width: auto !important; }
    .content { display: block !important; }
    .layout { display: block !important; }
    .sidebar { width: auto !important; border-right: none !important; display: flex; flex-wrap: wrap; padding: 0 !important; }
    .sidebar a { border-left: none !important; border-bottom: 3px solid transparent; padding: 10px 12px !important; font-size: 13px; }
    .sidebar a.active { border-left: none !important; border-bottom-color: #1a6b4a; }
    .cards { display: block !important; }
    .card { margin-bottom: 12px; }
    .nav-inner { overflow-x: auto; }
    .nav-inner a { padding: 11px 15px !important; font-size: 13px; }
    .banner { padding: 30px 18px !important; }
    .search-bar input { width: 100% !important; }
    .box { margin: 14px; padding: 26px 20px !important; }
    .main { margin: 10px auto !important; }
    .content { margin: 20px auto !important; }
    .post-head .title, .news-detail .title { font-size: 17px !important; }
    .data-table { font-size: 12px; }
    .data-table th, .data-table td { padding: 5px 7px; }
    .panel { margin: 10px !important; }
    table { max-width: 100%; }
    .topbar .right { margin-left: 8px; }
  }
</style>
</head>
<body>
<div class="top"><div class="top-inner"><div class="logo">职场匿名区</div></div></div>
<div class="main">
  <div class="panel-title" id="resultTitle">搜索结果</div>
  <div id="resultArea"></div>
</div>
<script>
var q = '';
var params = window.location.search.substring(1).split('&');
for (var i = 0; i < params.length; i++) {
  var kv = params[i].split('=');
  if (kv[0] === 'q') q = decodeURIComponent(kv[1] || '');
}
document.getElementById('resultTitle').textContent = '搜索结果：' + q;
var area = document.getElementById('resultArea');
if (q.indexOf('江安') !== -1) {
  area.innerHTML =
    '<div class="result-item"><span class="tag banned">讨论区</span><a href="zone.html">江安医药内部交流区（已封禁）</a><div class="desc">创建于2021年，2022年10月后停止更新。当前状态：已封禁，仅可浏览历史帖子标题。</div></div>' +
    '<div class="result-item"><span class="tag">帖子</span><a href="ask.html">有没有人认识江安医药的老周？</a><div class="desc">作者：匿名用户 · 2024-11-09 · 5回复</div></div>' +
    '<div class="result-item"><span class="tag">帖子</span><a href="admin.html">江安医药内部系统管理员账号（付费）</a><div class="desc">作者：匿名 · 2023-11-05 · 5回复</div></div>' +
    '<div class="result-item"><span class="tag">帖子</span><a href="account.html">有没有人知道江安医药内部系统的账号怎么搞？</a><div class="desc">作者：匿名 · 2023-06-12 · 6回复</div></div>' +
    '<div class="result-item"><span class="tag">帖子</span><a href="thread.html?t=inteviewJiangAn">江安医药面试流程分享</a><div class="desc">作者：匿名 · 2023-06-12 · 3回复</div></div>' +
    '<div class="result-item"><span class="tag">帖子</span><a href="thread.html?t=offerJiangAn">江安医药的offer值得去吗？</a><div class="desc">作者：匿名 · 2023-11-02 · 8回复</div></div>';
} else {
  area.innerHTML = '<div class="no-result">未找到相关结果。</div>';
}
</script>
<div class="login-mask" id="loginMask"><div class="login-card"><h3>职场匿名区</h3><p>浏览需先登录。<br>匿名登录，无需账号密码。</p><button onclick="forumLogin()">登录</button><div class="note">登录即表示同意《匿名区使用条款》</div></div></div>
<div class="login-toast" id="loginToast">欢迎回来，陈默！</div>
<script>
var LOGIN_KEY = 'cm_forum_login';
function isLogged() { try { return localStorage.getItem(LOGIN_KEY) === '1'; } catch (e) { return false; } }
function forumLogin() {
  try { localStorage.setItem(LOGIN_KEY, '1'); } catch (e) {}
  var m = document.getElementById('loginMask');
  if (m) m.className = 'login-mask';
  var t = document.getElementById('loginToast');
  if (t) { t.style.display = 'block'; setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.style.display = 'none'; }, 700); }, 2400); }
}
if (!isLogged()) document.getElementById('loginMask').className = 'login-mask show';
</script>
<script>
/* ---- 访问保护 ---- */
(function () {
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
</body>
</html>
