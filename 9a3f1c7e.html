<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>处理完成 - 归档</title>
<style>
  body { font-family: SimSun, 宋体, serif; font-size: 14px; color: #333; background: #e9e9e9; margin: 0; padding: 20px; }
  .c { max-width: 780px; margin: 0 auto; background: #fff; border: 1px solid #b0b0b0; padding: 30px; line-height: 2; }
  .f { margin-top: 24px; border-top: 1px solid #ccc; padding-top: 10px; font-size: 11px; color: #aaa; }
  .alert { color: #a00; border: 1px solid #a00; padding: 10px; margin: 16px 0; background: #fff5f5; }
  .dl-btn { display: inline-block; margin: 16px 0; padding: 9px 28px; border: 1px solid #7a8a9a; background: linear-gradient(#f0f0f0, #d8d8d8); font-family: SimSun, 宋体, serif; font-size: 14px; cursor: pointer; color: #333; }
  .dl-btn:active { background: #d0d0d0; }
  .step { display: none; }
  .step.show { display: block; }
  /* ---- mobile ---- */
  @media (max-width: 720px) {
    body { -webkit-text-size-adjust: 100%; }
    .top-inner, .topbar-inner, .nav-inner, .content, .main, .header, .search-inner, .box, .result-body { max-width: 100% !important; }
    .main { display: block !important; }
    .right, .side-col { width: auto !important; }
    .content { display: block !important; }
    .layout { display: block !important; }
    .sidebar { width: auto !important; border-right: none !important; display: flex; flex-wrap: wrap; padding: 0 !important; }
    .sidebar a { border-left: none !important; border-bottom: 3px solid transparent; padding: 10px 12px !important; font-size: 13px; }
    .sidebar a.active { border-left: none !important; border-bottom-color: #1a6b4a; }
    .cards { display: block !important; }
    .card { margin-bottom: 12px; }
    .nav-inner { overflow-x: auto; }
    .nav-inner a { padding: 11px 15px !important; font-size: 13px; }
    .banner { padding: 30px 18px !important; }
    .search-bar input { width: 100% !important; }
    .box { margin: 14px; padding: 26px 20px !important; }
    .main { margin: 10px auto !important; }
    .content { margin: 20px auto !important; }
    .post-head .title, .news-detail .title { font-size: 17px !important; }
    .data-table { font-size: 12px; }
    .data-table th, .data-table td { padding: 5px 7px; }
    .panel { margin: 10px !important; }
    table { max-width: 100%; }
    .topbar .right { margin-left: 8px; }
  }
</style>
</head>
<body>
<script>
(function () {
  try { if (sessionStorage.getItem('ja_ending_ok') === '1') return; } catch (e) {}
  location.replace('index.html');
})();
</script>

<div class="c">
  <div id="step1" class="step show">
    <p>正在生成调查文件…</p>
    <p id="progress" style="color:#888; font-size:13px;">正在整理检索记录…</p>
  </div>
  <div id="step2" class="step">
    <p>调查文件已生成。</p>
    <button class="dl-btn" id="dlBtn">下载调查文件（.txt）</button>
    <p style="font-size:12px; color:#999;">文件包含本次会话的全部检索记录和时间线摘要。</p>
  </div>
  <div id="step3" class="step">
    <p>异常记录已归档。</p>
    <p>你的访问编号已纳入维护队列。</p>
    <p>本会话检索记录已合并至工号 0471。</p>
    <div class="alert">你的新身份：NULL。</div>
    <p>职责：维护数据清洗队列。</p>
    <p>第一条待处理记录：0471（已封存）。</p>
    <p>第二条待处理记录：访客-0000（你）。</p>
    <p>请确认。</p>
    <div class="f">下次数据清洗时，将由你确认同类记录。</div>
  </div>
</div>

<script>
var searchHistory = [];
try {
  var raw = localStorage.getItem('jangan_search_history');
  if (raw) searchHistory = JSON.parse(raw);
} catch(e) {}

setTimeout(function () { document.getElementById('progress').textContent = '正在生成时间线…'; }, 800);
setTimeout(function () { document.getElementById('progress').textContent = '正在写入文件…'; }, 1600);
setTimeout(function () {
  document.getElementById('step1').className = 'step';
  document.getElementById('step2').className = 'step show';
}, 2400);

document.getElementById('dlBtn').addEventListener('click', function () {
  var content = '江安医药内部信息平台 - 调查记录\n';
  content += '生成时间：' + new Date().toLocaleString() + '\n';
  content += '访问编号：admin（管理员）\n';
  content += '=================================\n\n';
  content += '【检索记录】\n';
  for (var i = 0; i < searchHistory.length; i++) content += (i + 1) + '. ' + searchHistory[i] + '\n';
  content += '\n【关键发现】\n';
  content += '- 工号0471原使用人周明，2022-10-19参与CT-2021-03项目，药物不良反应死亡。\n';
  content += '- 事故报告于2022-10-21被修改，死亡原因由“药物不良反应”改为“突发意外”。\n';
  content += '- 工号0471于2024-01-15分配至新入职员工。\n';
  content += '- 该员工于2024-11-11 03:14:07转入受试者名单，账号注销。\n';
  content += '- 操作人：NULL（系统临时权限）。\n';

  var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '调查记录_' + Date.now() + '.txt';
  a.click();
  URL.revokeObjectURL(url);

  document.getElementById('step2').className = 'step';
  document.getElementById('step3').className = 'step show';
});
</script>
<script>
/* ---- 访问保护 ---- */
(function () {
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
<script>
(function () {
  try { if (sessionStorage.getItem('ja_mode') !== 'hard') return; } catch (e) { return; }
  var box = document.querySelector('.c') || document.querySelector('.main') || document.body;
  var d = document.createElement('div');
  d.style.cssText = 'margin-top:26px;padding-top:14px;border-top:1px dashed #a00;color:#8a2020;font-size:12px;line-height:2;font-family:SimSun,宋体,serif;';
  d.innerHTML = '（困难版）你归档的不只是记录。<br>系统把「访客-0000」也归进了 0471 这一行。';
  box.appendChild(d);
})();
</script>
</body>
</html>
