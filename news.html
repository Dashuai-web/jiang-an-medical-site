<script>

  },
  n3: {
    title: '关于开展消防安全演练的通知', date: '2024-10-08', dept: '安全环保部',
    html: '<p>定于 10 月 18 日 15:00 在公司园区开展消防疏散演练，请各部门提前安排工作。</p><ul><li>演练范围：A 座、B 座全体办公区域。</li><li>疏散集合点：园区西侧停车场。</li><li>请勿乘坐电梯，按疏散指示图就近撤离。</li></ul><p>演练结束后在原地点集合点名，未到场人员由部门负责人说明情况。</p>'
  },
  n4: {
    title: '第三季度工作总结会议纪要', date: '2024-09-28', dept: '总经理办公室',
    html: '<p>9 月 26 日，公司召开 2024 年第三季度工作总结会，各部门负责人参会。</p><ul><li>药物研究院：2 个一致性评价品种完成 BE 试验，进入申报准备。</li><li>临床试验中心：Q3 承接 BE 试验 3 项，受试者依从率 96%。</li><li>生产管理部：固体制剂车间产能利用率 78%，较上季度提升 6 个百分点。</li><li>信息中心：v2.0 系统计划于 10 月底完成上线。</li></ul><p>会议要求各部门在四季度重点抓好年度指标收口和 2025 年预算编制工作。</p>'
  },
  n5: {
    title: '关于规范办公用品申领流程的通知', date: '2024-09-15', dept: '行政部',
    html: '<p>自 10 月 1 日起，办公用品申领统一在系统"行政服务—用品申领"中提交，不再接收纸质单。</p><ul><li>常规用品（笔、纸、文件夹）每月 1—5 日集中申领。</li><li>单价 200 元以上物品需部门负责人审批。</li><li>领用后 3 个工作日内到行政部前台签收。</li></ul><p>请各部门知悉并转达。</p>'
  },
  n6: {
    title: '2024年中秋节放假安排', date: '2024-09-01', dept: '行政部',
    html: '<p>根据国家法定节假日安排，结合公司实际，中秋节放假安排如下：</p><ul><li>放假时间：9 月 15 日至 9 月 17 日，共 3 天。</li><li>9 月 14 日（星期六）正常上班。</li><li>生产车间、临床试验中心按各自排班执行，值班表报行政部备案。</li></ul><p>放假期间请关闭电源、锁好门窗，注意出行安全。</p>'
  }
};
NEWS.n1 = {
  title: '关于新信息系统 v2.0 上线的通知', date: '2024-10-28', dept: '信息中心',
  html: '<p>各部门、各位同事：</p><p>为进一步提升公司信息化管理水平，新信息系统 v2.0 已于 2024年10月28日 正式上线。现将有关事项通知如下：</p><ul><li>新系统检索模块统一升级，旧版入口不再维护。</li><li>数据迁移完成，旧系统数据已按新规则清洗并归档。</li><li>移除旧版调试入口。</li><li>临床试验受试者管理模块已并入新系统。</li></ul><p>新系统上线初期可能存在数据同步延迟，请各位同事耐心等待。如有疑问，请联系信息中心。</p><p>特此通知。</p>',
  legacy: true
};
var ORDER = ['n1', 'n2', 'n3', 'n4', 'n5', 'n6', 'n7'];
var META = { n1: '2024-10-28', n2: '2024-10-15', n3: '2024-10-08', n4: '2024-09-28', n5: '2024-09-15', n6: '2024-09-01', n7: '2021-09-10' };
var LIST = {
  n7: { title: '关于开展信息系统安全培训的通知', date: '2021-09-10', url: 'secure.html' },
  n1: { title: '关于新信息系统 v2.0 上线的通知', date: '2024-10-28', url: 'news.html?n=n1' },
  n2: { title: '2024年度员工体检安排通知', date: '2024-10-15', url: 'news.html?n=n2' },
  n3: { title: '关于开展消防安全演练的通知', date: '2024-10-08', url: 'news.html?n=n3' },
  n4: { title: '第三季度工作总结会议纪要', date: '2024-09-28', url: 'news.html?n=n4' },
  n5: { title: '关于规范办公用品申领流程的通知', date: '2024-09-15', url: 'news.html?n=n5' },
  n6: { title: '2024年中秋节放假安排', date: '2024-09-01', url: 'news.html?n=n6' }
};

function qs(k) {
  var m = location.search.substring(1).split('&');
  for (var i = 0; i < m.length; i++) {
    var p = m[i].split('=');
    if (decodeURIComponent(p[0]) === k) return decodeURIComponent(p[1] || '');
  }
  return '';
}
var n = qs('n');
var listView = document.getElementById('listView');
var detailView = document.getElementById('detailView');

function renderList() {
  var html = '<ul class="news-list">';
  html += '<li><a href="' + LIST.n1.url + '">' + LIST.n1.title + '</a><span class="date">' + LIST.n1.date + '</span></li>';
  ['n2', 'n3', 'n4', 'n5', 'n6'].forEach(function (k) {
    html += '<li><a href="' + LIST[k].url + '">' + LIST[k].title + '</a><span class="date">' + LIST[k].date + '</span></li>';
  });
  html += '<li><a href="' + LIST.n7.url + '">' + LIST.n7.title + '</a><span class="date">' + LIST.n7.date + '</span></li>';
  html += '</ul>';
  listView.innerHTML = html;
  listView.style.display = 'block';
  detailView.style.display = 'none';
  document.getElementById('pageTitle').textContent = '新闻中心';
}

function renderDetail(k) {
  var d = NEWS[k];
  if (!d) { renderList(); return; }
  var html = '<div class="title">' + d.title + '</div>';
  html += '<div class="meta">发布部门：' + d.dept + ' &nbsp;|&nbsp; 发布时间：' + d.date + '</div>';
  html += '<div class="body">' + d.html + '</div>';
  if (d.legacy) {
    html += '<div class="footer-note">如需调试旧版功能，可访问 <a href="login.html">v1.9.4 预览环境</a>。数据完整性不作保证。</div>';
  }
  html += '<a href="news.html" class="back-link">&larr; 返回新闻列表</a>';
  detailView.innerHTML = html;
  detailView.style.display = 'block';
  listView.style.display = 'none';
  document.getElementById('pageTitle').textContent = d.title;
  document.title = d.title + ' - 江安医药科技有限公司';
  window.scrollTo(0, 0);
}

if (n && NEWS[n]) { renderList(); renderDetail(n); } else { renderList(); }
</script>
