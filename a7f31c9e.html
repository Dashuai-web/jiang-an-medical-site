var STAGE_TOTAL = 3 + 9 + 6 + 4;
var stage = 1;
var _s = qs('s');
if (_s) {
  var _n = parseInt(_s, 10);
  if (_n >= 1 && _n <= 4) stage = _n;
}
var searched = {};
var seen = {};
var unlockedLock = false;
var finished = false;

document.getElementById('total').textContent = DATA.length;
document.getElementById('sid').textContent = Math.random().toString(16).slice(2, 8).toUpperCase();
document.getElementById('stageLabel').textContent = '层级 ' + stage;

function qs(k) {
  var m = location.search.substring(1).split('&');
  for (var i = 0; i < m.length; i++) {
    var p = m[i].split('=');
    if (decodeURIComponent(p[0]) === k) return decodeURIComponent(p[1] || '');
  }
  return '';
}
function norm(x) {
  return x.replace(/[\uFF01-\uFF5E]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/\u3000/g, ' ').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '').toLowerCase();
}

function countSeen() { return Object.keys(seen).length; }

function feedHTML(title, meta, body, cls) {
  var h = '<div class="post ' + (cls || '') + '"><div class="ph">' + title + '</div>';
  if (meta) h += '<div class="pm">' + meta + '</div>';
  h += '<div class="pb">' + body + '</div></div>';
  return h;
}

function push(html) {
  var d = document.createElement('div');
  d.innerHTML = html;
  var feed = document.getElementById('feed');
  feed.insertBefore(d.firstChild, feed.firstChild);
  window.scrollTo(0, 0);
}

function sysMsg(txt) {
  push('<div class="sysmsg">' + txt + '</div>');
}

function findPost(n) {
  for (var i = 0; i < DATA.length; i++) {
    var d = DATA[i];
    if (d.s > stage) continue;
    for (var j = 0; j < d.k.length; j++) {
      if (norm(d.k[j]) === n) return d;
    }
  }
  return null;
}

function showPost(d) {
  if (d.lock && !unlockedLock) {
    push('<div class="lockbox"><p>■■ 该文件已加密。需要密钥。</p>' +
      '<input id="pw" type="password" maxlength="12" placeholder="密钥">' +
      '<button id="pwgo">打开</button><p class="dim" style="margin-top:10px;font-size:11px;" id="pwerr"></p></div>');
    document.getElementById('pwgo').addEventListener('click', tryUnlock);
    document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
    return;
  }
  var body = d.b.join('');
  push(feedHTML(d.t, d.m, body));
  seen[d.t] = 1;
  document.getElementById('cnt').textContent = countSeen();
  checkStage();
}

function _h(t) { var x = 0; for (var i = 0; i < t.length; i++) x += t.charCodeAt(i); return x * 31 + t.length; }

function tryUnlock() {
  var v = norm(document.getElementById('pw').value);
  if (_h(v) === 12904) {   /* 校验和，密码不落明文 */
    unlockedLock = true;
    var d = DATA[0];
    for (var i = 0; i < DATA.length; i++) if (DATA[i].lock) d = DATA[i];
    var body = d.b.join('');
    push(feedHTML('仪式流程（解密）', '密钥正确 · 只读', body));
    seen['仪式流程'] = 1;
    document.getElementById('cnt').textContent = countSeen();
    checkStage();
  } else {
    document.getElementById('pwerr').textContent = '密钥错误。';
    document.getElementById('pwerr').className = 'warnline';
  }
}

function checkStage() {
  var n = Object.keys(searched).length;

    document.getElementById('stageLabel').textContent = '层级 4';
  } else if (stage === 4 && !finished && seen['承者簿 · 第 7 条'] && seen['第七位']) {
    finished = true;
    showEnding();
  }
}

function showEnding() {
  var box = document.createElement('div');
  box.className = 'endbox';
  box.innerHTML = '<h3>你已经看完了。现在选。</h3>' +
    '<button data-a="police">报警</button>' +
    '<button data-a="public">公开</button>' +
    '<button data-a="enter">进入</button>';
  document.getElementById('feed').insertBefore(box, document.getElementById('feed').firstChild);
  var btns = box.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () { finale(this.getAttribute('data-a')); });
  }
  window.scrollTo(0, 0);
}

function finale(a) {
  var txt = '';
  if (a === 'police') {
    txt = '<p>你拨了 110。</p><p>接线员听完，问你：江安医药，是高新区那个江安吗？</p><p>你说，是。</p>' +
          '<p class="dim">然后是一段很长的静音。她说：这个号码，登记在我们内部线路上。</p>' +
          '<p>你挂断了。你记下了她的工号。你把它写进承者簿。</p>';
  } else if (a === 'public') {
    txt = '<p>你把镜像打包，发到匿名区。</p><p>三分钟后，帖子标题变成：该用户不存在。</p>' +
          '<p class="dim">又过了两分钟，你的账号注销了。</p>' +
          '<p>平台上多了一条新帖：《有没有人认识陈默？》</p>';
  } else {
    txt = '<p>你在承者簿第七行，补上了那个空缺的印。</p><p>18。</p>' +
          '<p class="dim">系统提示：编号 0472 已注销。第 7 次未完成。</p>' +
          '<p>承者簿翻到第八行，第一栏写着你的名字。</p>';
  }
  var box = document.querySelector('.endbox');
  if (box) box.style.display = 'none';
  push(feedHTML('会话结束', '镜像已断开', txt));
  var f = document.createElement('div');
  f.className = 'final';
  f.innerHTML = '江安医药 · 第 <span class="blink">7</span> 次（未完成）<br>承者：陈默'
    + '<br><span style="font-size:12px;color:#2f5a45;letter-spacing:1px;">调查者：张青</span>';
  document.querySelector('.wrap').appendChild(f);
}

document.getElementById('go').addEventListener('click', run);
document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });

function run() {
  var raw = document.getElementById('q').value;
  var n = norm(raw);
  if (!n) return;
  document.getElementById('q').value = '';

  var d = findPost(n);
  if (!d) {
    push(feedHTML('未命中', '', '<p class="dim">对不起，没有找到匹配的记录。</p><p class="dim">请更换关键词后重新检索。</p>'));
    return;
  }
  if (searched[n]) {
    push(feedHTML(d.t, d.m, d.b.join('')));
    return;
  }
  searched[n] = 1;
  document.getElementById('hint').textContent = '镜像只回应它认识的词。已命中 ' + Object.keys(searched).length + ' 次。';
  showPost(d);
}

document.getElementById('hint').textContent = '镜像只回应它认识的词。不认识的，不会给你任何回答。';
document.getElementById('q').focus();
</script>
<script>
/* ---- 访问保护 ---- */
(function () {
  if (/[?&]nodev=1/.test(location.search)) return;
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
