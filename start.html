<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江安医药</title>
<style>
  :root {
    --bg: #ffffff;
    --ice: #2f7fb8;
    --ice-dim: #e5f1f9;
    --frost: #5a5a9a;
    --frost-dim: #ecebf7;
    --text: #2a2f36;
    --muted: #7c8794;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  .wrap { max-width: 900px; width: 100%; text-align: center; }

  .eyebrow { font-size: 12px; letter-spacing: .6em; color: #a9b3be; margin-bottom: 22px; }
  h1 { font-size: 42px; letter-spacing: .18em; margin: 0 0 10px; font-weight: 600; }
  .tagline { font-size: 14px; color: var(--muted); line-height: 1.9; margin-bottom: 46px; }

  .cards { display: flex; gap: 24px; justify-content: center; }
  .card {
    position: relative; flex: 1 1 300px; max-width: 340px;
    border: 1px solid #e6ebf0; border-radius: 16px;
    padding: 34px 28px 30px; text-align: left; cursor: pointer; text-decoration: none; color: inherit;
    background: #fff;
    box-shadow: 0 2px 12px rgba(20,40,60,.04);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-5px); }
  .card.normal:hover { border-color: rgba(47,127,184,.4); box-shadow: 0 16px 40px -20px rgba(47,127,184,.35); }
  .card.hard:hover { border-color: rgba(90,90,154,.4); box-shadow: 0 16px 40px -20px rgba(90,90,154,.35); }

  .icon {
    width: 52px; height: 52px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin-bottom: 20px;
  }
  .normal .icon { background: var(--ice-dim); color: var(--ice); }
  .hard .icon { background: var(--frost-dim); color: var(--frost); }

  .tag { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 20px; letter-spacing: .12em; margin-bottom: 14px; }
  .normal .tag { color: var(--ice); background: var(--ice-dim); }
  .hard .tag { color: var(--frost); background: var(--frost-dim); }

  .card h2 { font-size: 20px; margin: 0 0 10px; letter-spacing: .06em; font-weight: 600; }
  .card h2 .beta {
    font-size: 10px; letter-spacing: 1px; padding: 1px 7px; border-radius: 4px;
    background: #b06a3a; color: #fff; font-weight: normal; vertical-align: 3px; margin-left: 6px;
  }
  .card .warnline { font-size: 11px; color: #a0602a; margin-top: 12px; line-height: 1.7; }
  .card .desc { font-size: 13px; color: var(--muted); line-height: 1.9; min-height: 52px; }
  .card .go { display: flex; align-items: center; gap: 6px; margin-top: 22px; font-size: 13px; }
  .normal .go { color: var(--ice); }
  .hard .go { color: var(--frost); }
  .go .arr { transition: transform .18s ease; }
  .card:hover .go .arr { transform: translateX(5px); }

  .foot { margin-top: 42px; font-size: 12px; color: #a9b3be; }
  .foot a { color: #a9b3be; text-decoration: none; border-bottom: 1px solid #dfe5ea; padding-bottom: 1px; }
  .foot a:hover { color: var(--ice); border-color: #bcd2e2; }

  @media (max-width: 700px) {
    h1 { font-size: 32px; }
    .cards { flex-direction: column; align-items: center; }
    .card { max-width: 460px; width: 100%; }
    .card .desc { min-height: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">JIANGAN PHARMA</div>
  <h1>江安医药员工失踪事件</h1>
  <div class="tagline">
    一段关于一家医药公司的故事。<br>
    选择你的方式，继续往下查。
  </div>

  <div class="cards">
    <a class="card normal" href="intro.html" onclick="setMode('normal')">
      <div class="tag">标 准</div>
      <h2>普通版</h2>
      <div class="desc">顺着官网、论坛与内网一路查下去。<br>提示完整，按图索骥即可。</div>
      <div class="go">进入 <span class="arr">→</span></div>
    </a>

    <a class="card hard" href="hard.html" onclick="setMode('hard')">
      <div class="tag">硬 核 解 谜</div>
      <h2>困难版 <span class="beta">BETA</span></h2>
      <div class="desc">提示更少。旧电脑、服务器终端、电码、404……<br>你需要更多手段。</div>
      <div class="warnline">测试版本，可能不稳定，建议优先尝试普通版。</div>
      <div class="go">进入 <span class="arr">→</span></div>
    </a>
  </div>

  <div class="foot">
    卡住了？ <a href="guide.html">查看攻略文档</a>
  </div>
</div>

<script>
function setMode(m) {
  try { sessionStorage.setItem('ja_mode', m); } catch (e) {}
}
</script>
<script>
/* ---- 访问保护 ---- */
(function () {
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
</body>
</html>
