<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江安医药</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: #101418; color: #d8e0e6;
         font-family: "Microsoft YaHei", sans-serif; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  .wrap { max-width: 860px; width: 100%; padding: 40px 20px; text-align: center; }
  .logo { font-size: 13px; letter-spacing: 6px; color: #5a6b78; margin-bottom: 26px; }
  .title { font-size: 26px; letter-spacing: 3px; color: #cfe0ee; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #6b7a86; line-height: 1.9; margin-bottom: 38px; }
  .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .card {
    flex: 1 1 240px; max-width: 320px; border: 1px solid #2a3540; border-radius: 8px;
    padding: 30px 22px; cursor: pointer; text-align: left; transition: border-color .2s, transform .15s;
    background: #161d23; text-decoration: none; color: inherit; display: block;
  }
  .card:hover { border-color: #4a7a5a; transform: translateY(-3px); }
  .card .k { font-size: 17px; color: #cfe0ee; margin-bottom: 10px; letter-spacing: 1px; }
  .card .d { font-size: 12px; color: #7a8a96; line-height: 1.9; }
  .card .tag { display: inline-block; font-size: 10px; padding: 1px 7px; border: 1px solid #3a4a56;
               border-radius: 10px; color: #8a9aa6; margin-bottom: 12px; }
  .card.hard { border-color: #5a3a3a; }
  .card.hard:hover { border-color: #a05a5a; }
  .card.hard .k { color: #e0b0b0; }
  .card.hard .tag { border-color: #6a4a4a; color: #c09a9a; }
  .foot { margin-top: 34px; font-size: 11px; color: #4a5a66; letter-spacing: 1px; }
  @media (max-width: 720px) {
    .cards { flex-direction: column; align-items: center; }
    .card { max-width: 420px; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">JIANGAN</div>
  <div class="title">你查到了这里</div>
  <div class="sub">一段关于一家医药公司的故事。选择你要继续的方式。</div>
  <div class="cards">
    <a class="card" href="intro.html" onclick="setMode('normal')">
      <div class="tag">标准</div>
      <div class="k">普通版</div>
      <div class="d">原有体验。顺着官网、论坛与内网，一路查下去。</div>
    </a>
    <a class="card hard" href="hard.html" onclick="setMode('hard')">
      <div class="tag">硬核解谜</div>
      <div class="k">困难版</div>
      <div class="d">提示更少。旧电脑、服务器、电码、404…… 你需要更多手段。</div>
    </a>
  </div>
  <div class="foot">攻略文档：<a href="guide.html" style="color:#5a6b78;">guide.html</a></div>
</div>
<script>
function setMode(m) {
  try { sessionStorage.setItem('ja_mode', m); } catch (e) {}
}
</script>
</body>
</html>
