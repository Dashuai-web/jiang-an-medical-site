<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 0; background: #f0f2f5; font-size: 14px; color: #333; }
  .topbar { background: #1a6b4a; color: #fff; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
  .topbar .left { display: flex; align-items: center; gap: 14px; }
  .topbar .logo { font-size: 17px; font-weight: bold; letter-spacing: 2px; }
  .topbar .ver { font-size: 11px; color: #a8d0b8; border: 1px solid #3a8a5a; padding: 1px 6px; border-radius: 2px; }
  .topbar .right { font-size: 13px; color: #c8e8d8; }
  .topbar .right a { color: #c8e8d8; text-decoration: none; margin-left: 16px; }
  .layout { display: flex; min-height: calc(100vh - 52px); }
  .sidebar { width: 200px; background: #fff; border-right: 1px solid #e0e0e0; padding: 12px 0; }
  .sidebar a { display: block; padding: 10px 24px; color: #555; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
  .sidebar a:hover { background: #f5f9f7; color: #1a6b4a; }
  .sidebar a.active { background: #eef7f2; color: #1a6b4a; border-left-color: #1a6b4a; font-weight: bold; }
  .main { flex: 1; padding: 24px 30px; }
  .panel { background: #fff; border-radius: 4px; border: 1px solid #e8e8e8; margin-bottom: 18px; max-width: 700px; }
  .panel-head { padding: 14px 24px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: bold; color: #333; }
  .panel-body { padding: 8px 0; }
  .info-row { display: flex; padding: 10px 24px; border-bottom: 1px solid #f2f2f2; font-size: 13px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { width: 180px; color: #888; }
  .info-row .value { flex: 1; color: #333; }
  .footer { text-align: center; padding: 16px 0 24px; font-size: 11px; color: #bbb; }
  .legacy-link { font-size: 11px; color: #e8e8e8; text-decoration: none; }
  .legacy-link:hover { color: #1a6b4a; text-decoration: underline; }
  /* ---- mobile ---- */
  @media (max-width: 720px) {
    body { -webkit-text-size-adjust: 100%; }
    .top-inner, .topbar-inner, .nav-inner, .content, .main, .header, .search-inner, .box, .result-body { max-width: 100% !important; }
    .main { display: block !important; }
    .right, .side-col { width: auto !important; }
    .content { display: block !important; }
    .layout { display: block !important; }
    .sidebar { width: auto !important; border-right: none !important; display: flex; flex-wrap: wrap; padding: 0 !important; }
    .sidebar a { border-left: none !important; border-bottom: 3px solid transparent; padding: 10px 12px !important; font-size: 13px; }
    .sidebar a.active { border-left: none !important; border-bottom-color: #1a6b4a; }
    .cards { display: block !important; }
    .card { margin-bottom: 12px; }
    .nav-inner { overflow-x: auto; }
    .nav-inner a { padding: 11px 15px !important; font-size: 13px; }
    .banner { padding: 30px 18px !important; }
    .search-bar input { width: 100% !important; }
    .box { margin: 14px; padding: 26px 20px !important; }
    .main { margin: 10px auto !important; }
    .content { margin: 20px auto !important; }
    .post-head .title, .news-detail .title { font-size: 17px !important; }
    .data-table { font-size: 12px; }
    .data-table th, .data-table td { padding: 5px 7px; }
    .panel { margin: 10px !important; }
    table { max-width: 100%; }
    .topbar .right { margin-left: 8px; }
  }
</style>

<script>
/* ---- 访问保护 ---- */
(function () {
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
