<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江安医药 · 服务器</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0c0e; color: #c8d8c8;
         font-family: "Consolas", "Courier New", monospace; }
  #term { max-width: 820px; margin: 0 auto; padding: 26px 18px 60px; min-height: 100vh; }
  .line { white-space: pre-wrap; line-height: 1.65; font-size: 13px; }
  .in { color: #7fb07f; }
  .out { color: #b0c0b0; }
  .warn { color: #d8a860; }
  .err { color: #c06a5a; }
  .boot { color: #5a6a5a; font-size: 12px; line-height: 1.7; }
  .prow { display: flex; }
  .prow .ps { color: #7fb07f; white-space: nowrap; }
  input { background: transparent; border: none; outline: none; color: #c8d8c8;
          font-family: inherit; font-size: 13px; flex: 1; caret-color: #7fb07f; }

  /* ---- 节点选择 ---- */
  #conn { max-width: 820px; margin: 0 auto; padding: 54px 18px; font-size: 13px; line-height: 2; color: #8a9a8a; }
  #conn .h { color: #7fb07f; margin-bottom: 16px; letter-spacing: 1px; }
  #conn .row { display: flex; align-items: center; gap: 10px; }
  #conn .name { width: 64px; color: #b0c0b0; }
  #conn .bar { flex: 1; color: #2f5a45; letter-spacing: 1px; overflow: hidden; white-space: nowrap; }
  #conn .ms { width: 72px; text-align: right; color: #c8d8c8; }
  #conn .ok { margin-top: 16px; color: #d8a860; }

  @media (max-width: 720px) {
    body { -webkit-text-size-adjust: 100%; }
    #term { padding: 18px 12px 50px; }
    .line { font-size: 12px; }
    #conn { padding: 36px 12px; font-size: 12px; }
    #conn .name { width: 56px; }
    #conn .ms { width: 64px; }
  }
</style>
</head>
<body>
<div id="conn"></div>
<div id="term" style="display:none"></div>
<script>
var term = document.getElementById('term');
var prow = null;

/* ---------- 输出队列（打字机效果） ---------- */
var queue = [];
var flushing = false;
function out(cls, txt) {
  queue.push({ c: cls, t: txt });
  if (!flushing) flushQueue();
}
function flushQueue() {
  if (!queue.length) { flushing = false; return; }
  flushing = true;
  var item = queue.shift();
  var d = document.createElement('div');
  d.className = 'line ' + (item.c || 'out');
  d.textContent = item.t;
  d.style.opacity = '0';
  d.style.transition = 'opacity .12s';
  if (prow && prow.parentNode === term) term.insertBefore(d, prow);
  else term.appendChild(d);
  setTimeout(function () { d.style.opacity = '1'; }, 10);
  window.scrollTo(0, document.body.scrollHeight);
  setTimeout(flushQueue, 45);
}

/* ---------- 文件系统 ---------- */

FS['/root/verify.txt'] = '校验码 = 年份后两位 + 编号 = 22 + 0471 = 220471\n\n收尾：verify 220471\n要往更深处走，选「外传」。\n';

var DIRS = { '/': '', '/etc': '', '/etc/security': '', '/var': '', '/var/log': '', '/var/mail': '',
             '/home': '', '/home/zhouming': '', '/home/zhouming/.ssh': '', '/srv': '',
             '/srv/clinical': '', '/srv/intranet': '', '/srv/hr': '', '/opt': '', '/opt/backup': '', '/root': '' };

var cwd = '/';
var lv = 0;              // 0 访客 / 1 admin / 2 root
var unlocked = false;
var sawVerify = false;
var filesRead = {};
var suFails = 0;
var suLockUntil = 0;

var RITUAL = '仪式流程（解密）\n\n一、择人：入职三个月内、体检合格、无近亲同城\n二、换名：以受试者编号代称，姓名栏置空\n三、开场：以临床试验名义给药\n四、收：死亡登记为事故，编号封存 24 个月\n五、续：编号启用，承者簿添一行\n\n第 7 次：编号 0472，入职日 2024-11-18。\n校验码在 /root，需要 root 权限（sudo）。\n';

function resolve(p) {
  if (p === '/') return '/';
  var parts = [];
  var base = p.startsWith('/') ? '' : cwd;
  (base + '/' + p).split('/').forEach(function (s) {
    if (s === '' || s === '.') return;
    if (s === '..') parts.pop();
    else parts.push(s);
  });
  return '/' + parts.join('/');
}
function normPath(p) {
  var r = resolve(p).replace(/\/+/g, '/');
  if (r.length > 1 && r.endsWith('/')) r = r.slice(0, -1);
  return r || '/';
}
function needLv(path) {
  if (path === '/root' || path.indexOf('/root/') === 0) return 2;
  if (path === '/var/mail' || path.indexOf('/var/mail/') === 0) return 1;
  if (path === '/etc/shadow') return 1;
  if (path.indexOf('/home/zhouming/.ssh') === 0) return 1;
  return 0;
}
function denyText(path) {
  var need = needLv(path) === 2 ? 'root（sudo）' : 'admin（su）';
  return '权限不足：该路径需要 ' + need + ' 权限。';
}
function ls(p) {
  var path = normPath(p);
  if (lv < needLv(path)) return '__DENY__';
  if (Array.isArray(FS[path])) return FS[path].join('  ');
  if (typeof FS[path] === 'string') return path.split('/').pop();
  return null;
}
function cat(p) {
  var path = normPath(p);
  if (lv < needLv(path)) return '__DENY__';
  return typeof FS[path] === 'string' ? FS[path] : null;
}

function completePath(frag) {
  if (!frag) return null;
  var f = frag.toLowerCase();
  var abs = f.charAt(0) === '/';
  var cands = [];
  for (var d in DIRS) {
    if (d === '/') continue;
    var dn = d.split('/').pop().toLowerCase();
    if (abs ? d.toLowerCase().indexOf(f) === 0 : dn.indexOf(f) === 0) cands.push(d);
  }
  for (var k in FS) {
    if (typeof FS[k] !== 'string') continue;
    var bn = k.split('/').pop().toLowerCase();
    if (abs ? k.toLowerCase().indexOf(f) === 0 : bn.indexOf(f) === 0) cands.push(k);
  }
  cands.sort();
  return cands.length ? cands[0] : null;
}

function ending(url) {
  out('warn', '正在处理……');
  try { sessionStorage.setItem('ja_ending_ok', '1'); } catch (e) {}
  setTimeout(function () { location.href = url; }, 700);
}

function run(cmd) {
  var parts = cmd.trim().split(/\s+/);
  var c = parts[0];
  var arg = parts[1] || '';
  var arg2 = parts[2] || '';

  if (c === 'help' || c === '?') {
    out('out', '可用命令：');
    out('out', '  ls [路径]       列出目录（dir 同义）');
    out('out', '  cat <文件>      查看文件（type/open/read 同义，可只写文件名）');
    out('out', '  cd <目录>  pwd  切换/显示路径');
    out('out', '  su <口令>       提升为 admin');
    out('out', '  sudo <口令>     提升为 root');
    out('out', '  decrypt <文件> <密钥>  解密');
    out('out', '  status          查看当前状态');
    out('out', '  whoami / last / uptime  环境信息');
    out('out', '  verify <码>     提交校验码');
    out('out', '  clear           清屏');
    out('out', '');
    out('out', '提示：先 cat README。');
  } else if (c === 'ls' || c === 'dir') {
    var r = ls(arg);
    if (r === '__DENY__') out('err', denyText(normPath(arg)));
    else out('out', r === null ? 'ls: 无此文件或目录' : r);
  } else if (c === 'cat' || c === 'type' || c === 'open' || c === 'read') {
    var r = cat(arg);
    if (r === '__DENY__') {
      out('err', denyText(normPath(arg)));
    } else if (r !== null) {
      out('out', r);
      var np = normPath(arg);
      filesRead[np] = 1;
      if (np === '/root/verify.txt') sawVerify = true;
    } else {
      var hits = [];
      for (var k in FS) {
        if (typeof FS[k] !== 'string') continue;
        if (k.split('/').pop().toLowerCase() === arg.toLowerCase()) hits.push(k);
      }
      if (hits.length === 1) {
        out('out', cat(hits[0]));
        filesRead[hits[0]] = 1;
        if (hits[0] === '/root/verify.txt') sawVerify = true;
      } else if (hits.length > 1) {
        out('out', '找到多个同名文件，请写完整路径：\n' + hits.join('\n'));
      } else {
        out('out', 'cat: 无此文件（先用 ls 看看目录里有什么）');
      }
    }
  } else if (c === 'cd') {
    var target = normPath(arg);
    if (lv < needLv(target)) out('err', denyText(target));
    else if (DIRS.hasOwnProperty(target)) cwd = target;
    else out('out', 'cd: 无此目录');
  } else if (c === 'pwd') {
    out('out', cwd);
  } else if (c === 'su') {
    var now = Date.now();
    if (now < suLockUntil) {
      out('err', '账户已锁定，请 ' + Math.ceil((suLockUntil - now) / 1000) + ' 秒后再试。');
      return;
    }
    if (arg === 'jianganyiliao20241028') {
      lv = 1;
      suFails = 0;
      out('warn', '身份已切换为 admin。可访问 /var/mail、/etc/shadow、/home/zhouming/.ssh。');
    } else {
      suFails++;
      if (suFails >= 3) {
        suLockUntil = now + 30000;
        suFails = 0;
        out('err', '认证失败次数过多，账户锁定 30 秒。');
        out('out', 'auth.log 已记录本次尝试。');
      } else {
        out('err', 'su: 口令错误。（' + (3 - suFails) + ' 次后锁定）');
      }
    }
  } else if (c === 'sudo') {
    if (lv < 1) {
      out('err', 'sudo: 需要先 su 到 admin。');
    } else if (arg === '0471-6' || arg === '04716') {
      lv = 2;
      out('warn', 'root 权限已获取。可访问 /root。');
      out('out', '（提示：/root/.history 里有上一位管理员的命令记录）');
    } else {
      out('err', 'sudo: 口令错误。');
    }
  } else if (c === 'decrypt') {
    var f = normPath(arg);
    var key = arg2;
    if (f.indexOf('ritual.enc') !== -1) {
      if (key === '31415918') out('warn', RITUAL);
      else out('err', 'decrypt: 密钥错误。');
    } else if (f.indexOf('enc.bak') !== -1) {
      out('err', 'decrypt: 密钥缺失（该备份的密钥不在本节点）。');
    } else {
      out('out', 'decrypt: 无此加密文件。');
    }
  } else if (c === 'status') {
    out('out', '权限：' + (lv === 2 ? 'root' : (lv === 1 ? 'admin' : '访客')));
    out('out', '已读文件：' + Object.keys(filesRead).length + ' 个');
    out('out', '工作目录：' + cwd);
    out('out', '会话标记：' + (unlocked ? '已通过校验' : '未通过校验'));
  } else if (c === 'whoami') {
    out('out', lv === 2 ? 'root' : (lv === 1 ? 'admin' : 'guest'));
  } else if (c === 'last') {
    out('out', 'zhouming  pts/0  2022-10-19 22:15 (10.8.4.71)\nadmin     pts/0  2022-10-19 22:10 (10.8.4.72)');
  } else if (c === 'uptime') {
    out('out', ' 22:15:07 up 2190 days,  3:14,  1 user,  load average: 0.04, 0.03, 0.00');
  } else if (c === 'verify') {
    if (arg === '220471') {
      if (!sawVerify) {
        out('err', '你真的好好玩了吗？？？？');
        out('err', '攻略这波立大功了。');
        out('warn', '系统记录：本次会话未发现任何勘察痕迹。');
        out('out', '这个码从哪来的？先去把服务器翻一遍，再来。');
        return;
      }
      unlocked = true;
      out('warn', '校验通过。会话已标记为「异常输入源」。');
      out('warn', '请选择处理方式，直接在命令行输入：');
      out('warn', '  归档   （archive）');
      out('warn', '  外传   （spread）');
      out('warn', '  退出   （exit）');
      try { sessionStorage.setItem('ja_ending_ok', '1'); } catch (e) {}
    } else {
      out('err', 'verify: 校验码错误。');
    }
  } else if (c === '归档' || c === 'archive') {
    if (!unlocked) out('err', '尚未通过校验。');
    else ending('../9a3f1c7e.html');
  } else if (c === '外传' || c === 'spread') {
    if (!unlocked) out('err', '尚未通过校验。');
    else ending('../c47b0d92.html');
  } else if (c === '退出' || c === 'exit') {
    if (!unlocked) out('err', '尚未通过校验。');
    else ending('../e1b83a56.html');
  } else if (c === 'clear') {
    queue.length = 0;
    var lines = term.querySelectorAll('.line');
    for (var i = 0; i < lines.length; i++) lines[i].remove();
  } else {
    out('err', 'command not found: ' + c + '（输入 help 查看命令）');
  }
}

var REGIONS = [
  { n: '杭州', base: 12 },
  { n: '上海', base: 26 },
  { n: '深圳', base: 41 },
  { n: '香港', base: 58 },
  { n: '东京', base: 92 },
  { n: '新加坡', base: 118 }
];

function bar(n) { var s = ''; for (var i = 0; i < n; i++) s += '█'; return s; }

function connectAnim() {
  var box = document.getElementById('conn');
  var h = document.createElement('div');
  h.className = 'h';
  h.textContent = '正在寻找最快节点……';
  box.appendChild(h);
  var lat = [];
  var i = 0;
  function step() {
    if (i >= REGIONS.length) {
      var ok = document.createElement('div');
      ok.className = 'ok';
      ok.textContent = '已连接：' + REGIONS[0].n + ' · ' + lat[0] + ' ms';
      box.appendChild(ok);
      setTimeout(startTerminal, 900);
      return;
    }
    var r = REGIONS[i];
    var ms = r.base + Math.floor(Math.random() * 7);
    lat.push(ms);
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="name">' + r.n + '</span>' +
      '<span class="bar">' + bar(Math.max(2, 26 - Math.round(ms / 6))) + '</span>' +
      '<span class="ms">' + ms + ' ms</span>';
    box.appendChild(row);
    i++;
    setTimeout(step, 420 + Math.random() * 260);
  }
  step();
}

function startTerminal() {
  document.getElementById('conn').style.display = 'none';
  document.getElementById('term').style.display = 'block';
  out('boot', 'JIANGAN-PHARMA · 运维节点 2 (10.8.4.71)\n');
  out('boot', 'Last login: 2022-10-19 22:15 from 10.8.4.72\n');

  out('boot', '*  维护通知：本节点仅限内部使用。             *\n');
  out('boot', '*  所有操作将被记录。                         *\n');
  out('boot', '* * * * * * * * * * * * * * * * * * * * * * * *\n');
  out('boot', '\n输入 help 查看命令，Tab 可补全。\n');

  var prow_el = document.createElement('div');
  prow_el.className = 'prow';
  var ps = document.createElement('span');
  ps.className = 'ps';
  var input = document.createElement('input');
  input.autocomplete = 'off';
  input.spellcheck = false;
  prow_el.appendChild(ps);
  prow_el.appendChild(input);
  term.appendChild(prow_el);
  prow = prow_el;

  function promptText() {
    var u = lv === 2 ? 'root' : (lv === 1 ? 'admin' : 'guest');
    return u + '@jiangansrv:' + cwd + '$ ';
  }
  function refreshPrompt() { ps.textContent = promptText(); }
  refreshPrompt();

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var val = input.value;
      var sp = val.lastIndexOf(' ');
      if (sp === -1) {
        var cmds = ['help', 'ls', 'cat', 'open', 'read', 'cd', 'pwd', 'clear', 'verify',
                    'su', 'sudo', 'decrypt', 'status', 'whoami', 'last', 'uptime',
                    'dir', 'type', '归档', '外传', '退出'];
        var vv = val.trim();
        for (var i = 0; i < cmds.length; i++) {
          if (cmds[i].indexOf(vv) === 0) { input.value = cmds[i]; break; }
        }
      } else {
        var head = val.slice(0, sp + 1);
        var frag = val.slice(sp + 1);
        var done = completePath(frag);
        if (done) input.value = head + done;
      }
      return;
    }
    if (e.key !== 'Enter') return;
    var v = input.value;
    input.value = '';
    if (v.trim() === '') return;
    var echo = document.createElement('div');
    echo.className = 'line in';
    echo.textContent = promptText() + v;
    term.insertBefore(echo, prow);
    run(v);
    refreshPrompt();
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
  });
  input.focus();
}

connectAnim();
</script>
<script>
/* ---- 访问保护 ---- */
(function () {
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
