<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江安医药 · 服务器</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0c0e; color: #c8d8c8;
         font-family: "Consolas", "Courier New", monospace; }
  #term { max-width: 820px; margin: 0 auto; padding: 26px 18px 60px; min-height: 100vh; }
  .line { white-space: pre-wrap; line-height: 1.65; font-size: 13px; }
  .in { color: #7fb07f; }
  .out { color: #b0c0b0; }
  .warn { color: #d8a860; }
  .err { color: #c06a5a; }
  .boot { color: #5a6a5a; font-size: 12px; line-height: 1.7; }
  .prow { display: flex; }
  .prow .ps { color: #7fb07f; white-space: nowrap; }
  input { background: transparent; border: none; outline: none; color: #c8d8c8;
          font-family: inherit; font-size: 13px; flex: 1; caret-color: #7fb07f; }
</style>
</head>
<body>
<div id="term"></div>
<script>
var term = document.getElementById('term');
var prow = null;

function out(cls, txt) {
  var d = document.createElement('div');
  d.className = 'line ' + (cls || 'out');
  d.textContent = txt;
  if (prow && prow.parentNode === term) term.insertBefore(d, prow);
  else term.appendChild(d);
}

var FS = {
  '/': ['etc', 'var', 'home', 'srv', 'root', 'README'],
  '/README': '本节点所有时间字段使用 Unix 时间戳（自 1970-01-01 00:00:00 UTC 起算的秒数）。\n\n线索在哪：/srv/clinical（临床试验中心）、/var/log（日志）。\n管理员的文件在 /root，需要 su 提权。\n',
  '/etc': ['config', 'passwd', 'security', 'hosts'],
  '/etc/config': 'V2_BUILD_TS=1730073600\nLEGACY_BUILD_TS=1723680000\n',
  '/etc/passwd': 'admin:x:0:0:管理员:/root:/bin/sh\nzhouming:x:1001:1001:行政部:/home/zhouming:/bin/sh\n',
  '/etc/security': ['pwpolicy'],
  '/etc/security/pwpolicy': '管理员口令 = 公司名拼音 + 构建日期(YYYYMMDD)\n构建日期见 /etc/config。\n',
  '/etc/hosts': '10.8.4.71  legacy-portal\n10.8.4.72  v2-portal\n',
  '/var': ['log'],
  '/var/log': ['clean.log', 'sys.log', 'incident.log'],
  '/var/log/clean.log': '2022-10-21 02:00 数据清洗\n[NULL] 覆盖记录：源=0471，目标=空编号\n[NULL] 补录失败：姓名字段永久缺失\n# 该记录已封存\n',
  '/var/log/sys.log': '2024-11-11 03:14:07 0471 转入受试者名单\n2024-11-11 03:14:07 账号注销\n',
  '/var/log/incident.log': '事故编号 AQ-2022-10-19\n原始：药物不良反应 / 观察室 3 号\n修订(2022-10-21)：突发意外 / 办公楼三层\n修订人：NULL\n',
  '/home': ['zhouming'],
  '/home/zhouming': ['note.txt'],
  '/home/zhouming/note.txt': '小陈：\n我可能是第 6 次。\n记住编号 0471。\n—— 舅舅\n',
  '/srv': ['clinical', 'intranet'],
  '/srv/clinical': ['subjects.txt', 'consent.txt', 'roster.txt', 'ritual.enc', 'trial.log'],
  '/srv/clinical/subjects.txt': 'CT-2024-02 受试者名单（部分）\nS-001 外部   S-002 外部   S-003 外部   S-004 外部\n0471  内部（员工转入）  2024-11-11\n',
  '/srv/clinical/consent.txt': '员工健康知情同意书 · 第 4 条第 2 款：\n「员工同意公司根据项目需要安排其参与临床试验。」\n签署：入职时统一签署，全员。\n',
  '/srv/clinical/roster.txt': '承者簿（节选）\n次序  编号  日期         印\n1     0413  2012-10-18   3\n2     0427  2014-10-17   1\n3     0440  2016-10-19   4\n4     0452  2018-10-18   1\n5     0468  2020-10-19   5\n6     0471  2022-10-19   9\n7     0472  2024-11-18   ?\n',
  '/srv/clinical/ritual.enc': '（加密文件）\n解密命令：decrypt ritual.enc <8位密钥>\n密钥提示：承者簿上六个印，加第七位承者的入职日。\n',
  '/srv/clinical/trial.log': 'CT-2024-02 给药记录：\n2022-10-19 22:15 给药（0471，批号 JA-2021-033）\n22:45 出现不良反应\n23:47 宣告死亡\n23:47:03 系统自动生成空编号\n',
  '/srv/intranet': ['notice.txt'],
  '/srv/intranet/notice.txt': 'v2.0 上线公告（2024-10-28）\n年度体检项目：采血、心电图、生命体征监测。\n',
  '/root': ['verify.txt']
};
FS['/root/verify.txt'] = '校验码 = 年份后两位 + 编号 = 22 + 0471 = 220471\n\n收尾：verify 220471\n要往更深处走，选「外传」。\n';

var DIRS = { '/': '', '/etc': '', '/etc/security': '', '/var': '', '/var/log': '',
             '/home': '', '/home/zhouming': '', '/srv': '', '/srv/clinical': '', '/srv/intranet': '', '/root': '' };

var cwd = '/';
var root = false;
var unlocked = false;

var RITUAL = '仪式流程（解密）\n\n一、择人：入职三个月内、体检合格、无近亲同城\n二、换名：以受试者编号代称，姓名栏置空\n三、开场：以临床试验名义给药\n四、收：死亡登记为事故，编号封存 24 个月\n五、续：编号启用，承者簿添一行\n\n第 7 次：编号 0472，入职日 2024-11-18。\n收尾校验码在 /root，用 su 提权读取。\n';

function resolve(p) {
  if (p === '/') return '/';
  var parts = [];
  var base = p.startsWith('/') ? '' : cwd;
  (base + '/' + p).split('/').forEach(function (s) {
    if (s === '' || s === '.') return;
    if (s === '..') parts.pop();
    else parts.push(s);
  });
  return '/' + parts.join('/');
}
function normPath(p) {
  var r = resolve(p).replace(/\/+/g, '/');
  if (r.length > 1 && r.endsWith('/')) r = r.slice(0, -1);
  return r || '/';
}
function underRoot(p) { return p === '/root' || p.indexOf('/root/') === 0; }
function ls(p) {
  var path = normPath(p);
  if (underRoot(path) && !root) return '__DENY__';
  if (Array.isArray(FS[path])) return FS[path].join('  ');
  if (typeof FS[path] === 'string') return path.split('/').pop();
  return null;
}
function cat(p) {
  var path = normPath(p);
  if (underRoot(path) && !root) return '__DENY__';
  return typeof FS[path] === 'string' ? FS[path] : null;
}

function completePath(frag) {
  if (!frag) return null;
  var f = frag.toLowerCase();
  var abs = f.charAt(0) === '/';
  var cands = [];
  for (var d in DIRS) {
    if (d === '/') continue;
    var dn = d.split('/').pop().toLowerCase();
    if (abs ? d.toLowerCase().indexOf(f) === 0 : dn.indexOf(f) === 0) cands.push(d);
  }
  for (var k in FS) {
    if (typeof FS[k] !== 'string') continue;
    var bn = k.split('/').pop().toLowerCase();
    if (abs ? k.toLowerCase().indexOf(f) === 0 : bn.indexOf(f) === 0) cands.push(k);
  }
  cands.sort();
  return cands.length ? cands[0] : null;
}

function run(cmd) {
  var parts = cmd.trim().split(/\s+/);
  var c = parts[0];
  var arg = parts[1] || '';
  if (c === 'help' || c === '?') {
    out('out', '可用命令：');
    out('out', '  ls [路径]       列出目录内容（dir 同义）');
    out('out', '  cat <文件>      查看文件内容（type/open/read 同义，可直接写文件名）');
    out('out', '  cd <目录>       进入目录');
    out('out', '  pwd            显示当前路径');
    out('out', '  su <口令>       提升为管理员权限');
    out('out', '  decrypt <文件> <密钥>  解密文件');
    out('out', '  verify <码>     提交校验码');
    out('out', '  clear          清屏');
    out('out', '  ?              显示本帮助');
    out('out', '');
    out('out', '提示：先 cat README，再看 /srv/clinical 和 /var/log。');
  } else if (c === 'ls' || c === 'dir') {
    var r = ls(arg);
    if (r === '__DENY__') out('err', '权限不足：/root 需要管理员权限（su）。');
    else out('out', r === null ? 'ls: 无此文件或目录' : r);
  } else if (c === 'cat' || c === 'type' || c === 'open' || c === 'read') {
    var r = cat(arg);
    if (r === '__DENY__') {
      out('err', '权限不足：/root 需要管理员权限（su）。');
    } else if (r !== null) {
      out('out', r);
    } else {
      var hits = [];
      for (var k in FS) {
        if (typeof FS[k] !== 'string') continue;
        if (k.split('/').pop().toLowerCase() === arg.toLowerCase()) hits.push(k);
      }
      if (hits.length === 1) out('out', cat(hits[0]));
      else if (hits.length > 1) out('out', '找到多个同名文件，请写完整路径：\n' + hits.join('\n'));
      else out('out', 'cat: 无此文件（先用 ls 看看目录里有什么）');
    }
  } else if (c === 'cd') {
    var target = normPath(arg);
    if (underRoot(target) && !root) out('err', '权限不足：/root 需要管理员权限（su）。');
    else if (DIRS.hasOwnProperty(target)) cwd = target;
    else out('out', 'cd: 无此目录');
  } else if (c === 'pwd') {
    out('out', cwd);
  } else if (c === 'su') {
    if (arg === 'jianganyiliao20241028') {
      root = true;
      out('warn', '身份已切换为 admin。现在可以访问 /root 了。');
    } else {
      out('err', 'su: 口令错误。');
    }
  } else if (c === 'decrypt') {
    var f = normPath(parts[1] || '');
    var key = parts[2] || '';
    if (f === '/srv/clinical/ritual.enc' || f.endsWith('ritual.enc')) {
      if (key === '31415918') { out('warn', RITUAL); }
      else out('err', 'decrypt: 密钥错误。');
    } else {
      out('out', 'decrypt: 无此加密文件。');
    }
  } else if (c === 'verify') {
    if (arg === '220471') {
      unlocked = true;
      out('warn', '校验通过。会话已标记为「异常输入源」。处理方式：');
      out('warn', '  归档 ->  9a3f1c7e.html');
      out('warn', '  外传 ->  c47b0d92.html');
      out('warn', '  退出 ->  e1b83a56.html');
      try { sessionStorage.setItem('ja_ending_ok', '1'); } catch (e) {}
    } else {
      out('err', 'verify: 校验码错误。');
    }
  } else if (c === 'clear') {
    var lines = term.querySelectorAll('.line');
    for (var i = 0; i < lines.length; i++) lines[i].remove();
  } else {
    out('err', 'command not found: ' + c + '（输入 help 查看命令）');
  }
}

out('boot', 'JIANGAN-PHARMA · 运维节点 2\n');
out('boot', '连接已建立。最后登录：2022-10-19 22:15（终端 3F 观察室）\n');
out('boot', '输入 help 查看命令，Tab 可补全。\n');

var prow_el = document.createElement('div');
prow_el.className = 'prow';
var ps = document.createElement('span');
ps.className = 'ps';
var input = document.createElement('input');
input.autocomplete = 'off';
input.spellcheck = false;
prow_el.appendChild(ps);
prow_el.appendChild(input);
term.appendChild(prow_el);
prow = prow_el;

function refreshPrompt() { ps.textContent = 'jiangansrv:' + cwd + '$ '; }
refreshPrompt();

input.addEventListener('keydown', function (e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    var val = input.value;
    var sp = val.lastIndexOf(' ');
    if (sp === -1) {
      var cmds = ['help', 'ls', 'cat', 'open', 'read', 'cd', 'pwd', 'clear', 'verify', 'su', 'decrypt', 'dir', 'type'];
      var vv = val.trim();
      for (var i = 0; i < cmds.length; i++) {
        if (cmds[i].indexOf(vv) === 0) { input.value = cmds[i]; break; }
      }
    } else {
      var head = val.slice(0, sp + 1);
      var frag = val.slice(sp + 1);
      var done = completePath(frag);
      if (done) input.value = head + done;
    }
    return;
  }
  if (e.key !== 'Enter') return;
  var v = input.value;
  input.value = '';
  if (v.trim() === '') return;
  var echo = document.createElement('div');
  echo.className = 'line in';
  echo.textContent = 'jiangansrv:' + cwd + '$ ' + v;
  term.insertBefore(echo, prow);
  run(v);
  refreshPrompt();
  input.focus();
  window.scrollTo(0, document.body.scrollHeight);
});
input.focus();
</script>
</body>
</html>
