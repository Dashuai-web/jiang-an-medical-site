<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周明的电脑</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; background: #000;
         font-family: "Microsoft YaHei", "SimSun", sans-serif; }
  #bios { position: fixed; inset: 0; background: #000; color: #c8c8c8;
          font-family: Consolas, monospace; font-size: 13px; line-height: 1.8;
          padding: 40px 48px; z-index: 50; }
  #bios .ln { opacity: 0; transition: opacity .15s; white-space: pre-wrap; }
  #bios .ok { color: #7fb07f; }
  #desktop { position: relative; width: 100%; height: 100%;
             background: linear-gradient(135deg, #3a6ea5 0%, #2f5d8a 100%); padding: 18px;
             display: none; }
  .icon { position: absolute; width: 80px; text-align: center; cursor: pointer; color: #fff;
          text-shadow: 1px 1px 2px rgba(0,0,0,.6); user-select: none; }
  .icon .img { font-size: 30px; line-height: 1; }
  .icon .lb { font-size: 11px; margin-top: 4px; }
  #taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 32px;
             background: #24507d; border-top: 1px solid #1a3f66; display: flex;
             align-items: center; padding: 0 10px; color: #fff; font-size: 12px; z-index: 20; }
  #taskbar .start { background: #3a8a3a; padding: 4px 14px; border-radius: 3px; font-weight: bold; }
  #taskbar .clock { margin-left: auto; padding: 0 8px; border-left: 1px solid #1a3f66; }

  .win { position: absolute; background: #ece9d8; border: 2px solid #0a2a4a;
         box-shadow: 3px 3px 0 rgba(0,0,0,.3); min-width: 300px; max-width: 92vw; z-index: 10;
         display: flex; flex-direction: column; }
  .win .tb { background: #0a2a4a; color: #fff; padding: 4px 8px; font-size: 12px;
             display: flex; align-items: center; flex: none; }
  .win .tb .x { margin-left: auto; background: #c33; border: 1px solid #fff; padding: 0 7px; cursor: pointer; }
  .win .ct { padding: 12px 14px; font-size: 13px; color: #222; line-height: 1.9; max-height: 340px; overflow: auto; white-space: pre-wrap; }
  .win .ct.app { padding: 0; white-space: normal; max-height: none; overflow: hidden; }
  .win .ct .note { color: #7a5a00; }
  .win .ct .del { color: #8a2020; }
  .cap { font-size: 11px; color: #888; margin-top: 6px; }
  .win button { font-family: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
                background: #d9d4c6; border: 2px solid #f4f1ea; border-right-color: #808080; border-bottom-color: #808080; }
  .win input { font-family: inherit; font-size: 12px; padding: 3px 6px;
               border: 2px solid #808080; border-top-color: #4a4a4a; border-left-color: #4a4a4a; }
  .row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dotted #ccc; }

  /* ============ 微信 ============ */
  .wx { display: flex; height: 330px; font-size: 12px; background: #f5f5f5; }
  .wx .side { width: 146px; background: #ededed; border-right: 1px solid #d6d6d6; display: flex; flex-direction: column; flex: none; }
  .wx .me { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid #dcdcdc; }
  .wx .search { padding: 8px; }
  .wx .search div { background: #fff; border: 1px solid #dcdcdc; border-radius: 3px; padding: 3px 6px; color: #aaa; font-size: 11px; }
  .wx .contact { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; }
  .wx .contact:hover { background: #e5e5e5; }
  .wx .contact.on { background: #d4d4d4; }
  .av { width: 26px; height: 26px; border-radius: 3px; background: #7ab8f0; color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
  .av.g { background: #8bc34a; }
  .wx .main2 { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .wx .hdr { padding: 8px 12px; border-bottom: 1px solid #dcdcdc; font-size: 12px; color: #333; background: #f5f5f5; flex: none; }
  .wx .msgs { flex: 1; overflow: auto; padding: 12px; }
  .wx .msg { display: flex; gap: 8px; margin-bottom: 12px; }
  .wx .msg.me { flex-direction: row-reverse; }
  .wx .bubble { background: #fff; padding: 7px 10px; border-radius: 4px; max-width: 210px; line-height: 1.7; }
  .wx .msg.me .bubble { background: #95ec69; }
  .wx .draft { color: #a00; font-size: 11px; margin-top: 4px; }
  .wx .inputbar { border-top: 1px solid #dcdcdc; height: 34px; display: flex; align-items: center; padding: 0 10px; color: #aaa; font-size: 11px; flex: none; }

  /* ============ QQ ============ */
  .qq { display: flex; height: 330px; font-size: 12px; background: #f0f6ff; }
  .qq .side { width: 140px; background: #eaf2ff; border-right: 1px solid #cfe0f5; flex: none; }
  .qq .head2 { padding: 10px; border-bottom: 1px solid #cfe0f5; display: flex; align-items: center; gap: 8px; }
  .qq .grp { padding: 7px 10px; cursor: pointer; color: #33557a; }
  .qq .grp.on { background: #d6e6ff; }
  .qq .main2 { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .qq .hdr { padding: 8px 12px; border-bottom: 1px solid #cfe0f5; background: #f7fbff; flex: none; }
  .qq .msgs { flex: 1; overflow: auto; padding: 10px 12px; }
  .qq .m { margin-bottom: 10px; line-height: 1.7; }
  .qq .who2 { color: #1a6bb8; font-size: 11px; }
  .qq .sys { color: #8a9ab0; font-size: 11px; text-align: center; margin: 8px 0; }

  /* ============ 浏览器 ============ */
  .ie .chrome { background: #efefef; border-bottom: 1px solid #c8c8c8; padding: 4px 6px; display: flex; gap: 6px; align-items: center; flex: none; }
  .ie .btn2 { width: 20px; height: 20px; border: 1px solid #c0c0c0; background: #f8f8f8; text-align: center; line-height: 18px; color: #666; font-size: 11px; }
  .ie .addr { flex: 1; background: #fff; border: 1px solid #b0b0b0; padding: 2px 6px; font-size: 11px; color: #333; }
  .ie .bm { background: #f7f7f7; border-bottom: 1px solid #ddd; padding: 3px 8px; font-size: 11px; display: flex; gap: 12px; flex: none; }
  .ie .bm span { color: #1a4a8a; cursor: pointer; }
  .ie .bm span:hover { text-decoration: underline; }
  .ie .page { background: #fff; height: 268px; overflow: auto; font-size: 12px; }

  .pg-co { font-family: "Microsoft YaHei"; }
  .pg-co .h { background: #1a6b4a; color: #fff; padding: 12px 16px; font-size: 15px; letter-spacing: 1px; }
  .pg-co .nav2 { background: #14553a; color: #cfe8d8; padding: 5px 16px; font-size: 11px; }
  .pg-co .bd { padding: 14px 16px; color: #333; line-height: 1.9; }
  .pg-login { padding: 26px 30px; }
  .pg-login label { display: block; font-size: 12px; color: #555; margin: 10px 0 4px; }
  .pg-login input { width: 100%; padding: 4px 6px; border: 1px solid #bbb; font-size: 12px; }
  .pg-login .go { margin-top: 16px; background: #1a6b4a; color: #fff; padding: 6px 22px; font-size: 12px; border: none; cursor: pointer; }
  .pg-news { padding: 12px 16px; }
  .pg-news li { font-size: 12px; padding: 6px 0; border-bottom: 1px dotted #ddd; list-style: none; }
  .pg-news ul { margin: 0; padding: 0; }

  /* ============ QQ邮箱 ============ */
  .ml { display: flex; height: 330px; font-size: 12px; }
  .ml .folders { width: 112px; background: #fafafa; border-right: 1px solid #e2e2e2; flex: none; }
  .ml .folder { padding: 7px 10px; color: #444; cursor: pointer; }
  .ml .folder.on { background: #e8f1fb; color: #1a4a8a; font-weight: bold; }
  .ml .list { width: 190px; border-right: 1px solid #e2e2e2; overflow: auto; flex: none; }
  .ml .item { padding: 7px 9px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .ml .item:hover { background: #f4f8ff; }
  .ml .item.on { background: #eef5ff; }
  .ml .item .s { font-size: 11px; color: #999; }
  .ml .preview { flex: 1; padding: 12px 14px; overflow: auto; line-height: 1.85; min-width: 0; }
  .ml .preview .pm { font-size: 11px; color: #888; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-bottom: 8px; }

  /* ============ 资源管理器 ============ */
  .ex .bar { background: #f0f0f0; border-bottom: 1px solid #ccc; padding: 3px 8px; font-size: 11px; color: #444; flex: none; }
  .ex .files { background: #fff; height: 210px; overflow: auto; padding: 10px; }
  .ex .file { display: inline-block; width: 86px; text-align: center; font-size: 11px; margin: 6px 4px; cursor: pointer; color: #222; }
  .ex .file .ic2 { font-size: 22px; }

  @media (max-width: 720px) {
    body { -webkit-text-size-adjust: 100%; }
    .icon { width: 68px; }
    .icon .img { font-size: 26px; }
    #bios { padding: 24px 18px; font-size: 11px; }
    .wx, .qq, .ml { height: 300px; }
    .wx .side { width: 110px; }
    .ml .list { width: 140px; }
    .ml .folders { width: 90px; }
  }
</style>
</head>
<body>

<div id="bios"></div>

<div id="desktop">
  <div class="icon" style="left:16px;  top:12px;"  data-w="memo"><div class="img">📄</div><div class="lb">我的文档</div></div>
  <div class="icon" style="left:110px; top:12px;"  data-w="trash"><div class="img">🗑️</div><div class="lb">回收站</div></div>
  <div class="icon" style="left:204px; top:12px;"  data-w="computer"><div class="img">🖥️</div><div class="lb">我的电脑</div></div>
  <div class="icon" style="left:298px; top:12px;"  data-w="backup"><div class="img">📁</div><div class="lb">江安备份</div></div>

  <div class="icon" style="left:16px;  top:132px;" data-w="wechat"><div class="img">💬</div><div class="lb">微信</div></div>
  <div class="icon" style="left:110px; top:132px;" data-w="qq"><div class="img">🐧</div><div class="lb">QQ</div></div>
  <div class="icon" style="left:204px; top:132px;" data-w="browser"><div class="img">🌐</div><div class="lb">浏览器</div></div>
  <div class="icon" style="left:298px; top:132px;" data-w="mail"><div class="img">✉️</div><div class="lb">QQ邮箱</div></div>

  <div class="icon" style="left:16px;  top:252px;" data-w="vault"><div class="img">🔒</div><div class="lb">加密文件夹</div></div>
  <div class="icon" style="left:110px; top:252px;" data-w="cam"><div class="img">📷</div><div class="lb">监控截图</div></div>
  <div class="icon" style="left:204px; top:252px;" data-w="audio"><div class="img">🎙️</div><div class="lb">录音.mp3</div></div>
</div>

<div id="taskbar" style="display:none">
  <span class="start">开始</span>
  <span style="margin-left:12px;">周明</span>
  <span class="clock" id="clock"></span>
</div>

<script>
/* ================= BIOS ================= */
var BIOS_LINES = [
  'JiangAn BIOS v2.03  Copyright (C) 2015',
  'CPU : Intel Pentium III 866MHz',
  'Memory Test : 262144K OK',
  'Detecting IDE Primary Master ... ST380021A',
  'Detecting IDE Secondary Master ... None',
  'Keyboard ... Detected',
  'Mouse ... Detected',
  'System time : 2022-10-19 22:10:31',
  'Loading OS ...'
];
function bootBios() {
  var box = document.getElementById('bios');
  var i = 0;
  function step() {
    if (i >= BIOS_LINES.length) {
      setTimeout(function () {
        box.style.display = 'none';
        document.getElementById('desktop').style.display = 'block';
        document.getElementById('taskbar').style.display = 'flex';
      }, 450);
      return;
    }
    var d = document.createElement('div');
    d.className = 'ln' + (i >= BIOS_LINES.length - 2 ? ' ok' : '');
    d.textContent = BIOS_LINES[i];
    box.appendChild(d);
    setTimeout(function () { d.style.opacity = '1'; }, 10);
    i++;
    setTimeout(step, 180);
  }
  step();
}

/* ================= 数据 ================= */
var WX_CHATS = {
  liu: { name: '行政-小刘', msgs: [
    { who: 'o', t: '周哥，这周体检抽了四管血，往年才两管。' },
    { who: 'm', t: '我这也是。说是升级套餐。' },
    { who: 'o', t: '升级什么了也不说。算了。' }
  ] },
  chen: { name: '陈默（外甥）', msgs: [
    { who: 'm', t: '小陈，舅舅可能出事了。我的工号，工牌上还挂着。', draft: true }
  ] }
};

var QQ_GROUPS = {
  g: { name: '江安医药同事群', msgs: [
    { who: '同事A', t: '有人说凌晨三点又被叫去加班吗？' },
    { who: '同事B', t: '又来了。这个月第几次了。' },
    { who: '同事C', t: '别问，问就是系统维护。' },
    { who: '同事D', t: '我听见观察室三号有动静。' },
    { who: '同事A', t: '闭嘴。' }
  ] }
};

var MAILS = {
  inbox: [{ from: '江安医药 · 人事', subj: '入职体检安排', date: '2022-09-28',
    body: '新员工请于 11 月 4 日—22 日前往指定机构体检。\n\n项目：采血、心电图、生命体征监测。\n\n体检报告由行政部统一领取。' }],
  draft: [{ from: '草稿箱', subj: '未发出', date: '2022-10-19',
    body: '小陈，如果我出事，去查 10 月 19 日那天的事故。\n\n死亡原因那一栏被人改过。' }],
  sent: [], trash: []
};

var PAGES = {
  home: '<div class="pg-co"><div class="h">江安医药科技有限公司</div>' +
        '<div class="nav2">首页　关于我们　新闻中心　产品研发　临床试验　联系我们</div>' +
        '<div class="bd">专注创新药物研发，守护生命健康。<br><br>' +
        '公司新闻：<br>· 关于新信息系统 v2.0 上线的通知（2024-10-28）<br>' +
        '· 2024 年度员工体检安排通知<br>· 关于开展消防安全演练的通知</div></div>',
  news: '<div class="pg-news"><b>新闻中心</b><ul>' +
        '<li>关于新信息系统 v2.0 上线的通知　<span class="cap">2024-10-28</span></li>' +
        '<li>2024 年度员工体检安排通知　<span class="cap">2024-10-15</span></li>' +
        '<li>关于开展消防安全演练的通知　<span class="cap">2024-10-08</span></li>' +
        '<li>第三季度工作总结会议纪要　<span class="cap">2024-09-28</span></li>' +
        '</ul></div>',
  portal: '<div class="pg-login"><b>江安医药 内部信息平台 v1.9.4</b>' +
        '<label>工号 / 账号</label><input value="zhouming" readonly>' +
        '<label>密码</label><input type="password" value="00000000" readonly>' +
        '<button class="go">登 录</button>' +
        '<div class="cap" style="margin-top:12px;">上次登录：2022-10-19 22:10</div></div>'
};

/* ================= 窗口 ================= */
function closeWin() {
  var w = document.querySelector('.win');
  if (w) w.remove();
}

function renderWxChat(key) {
  var c = WX_CHATS[key];
  var out = '<div class="hdr">' + c.name + '</div><div class="msgs">';
  c.msgs.forEach(function (m) {
    out += '<div class="msg' + (m.who === 'm' ? ' me' : '') + '">' +
      '<div class="av' + (m.who === 'm' ? ' g' : '') + '">' + (m.who === 'm' ? '周' : '刘') + '</div>' +
      '<div><div class="bubble">' + m.t + '</div>' +
      (m.draft ? '<div class="draft">（未发送）</div>' : '') + '</div></div>';
  });
  out += '</div><div class="inputbar">输入消息…</div>';
  return out;
}

function openWin(k) {
  closeWin();
  var W = WIN[k];
  var w = document.createElement('div');
  w.className = 'win';
  w.style.left = (40 + Math.random() * 70) + 'px';
  w.style.top = (30 + Math.random() * 50) + 'px';
  w.style.width = (W.w || 360) + 'px';
  w.innerHTML = '<div class="tb"><span>' + W.t + '</span><span class="x" onclick="closeWin()">✕</span></div>' +
    '<div class="ct' + (W.app ? ' app' : '') + '">' + W.html + '</div>';
  document.getElementById('desktop').appendChild(w);

  if (k === 'wechat') {
    var main = w.querySelector('.wx .main2');
    w.querySelectorAll('.wx .contact').forEach(function (el) {
      el.addEventListener('click', function () {
        w.querySelectorAll('.wx .contact').forEach(function (x) { x.classList.remove('on'); });
        el.classList.add('on');
        main.innerHTML = renderWxChat(el.getAttribute('data-c'));
      });
    });
  }
  if (k === 'qq') {
    var main2 = w.querySelector('.qq .main2');
    w.querySelectorAll('.qq .grp').forEach(function (el) {
      el.addEventListener('click', function () {
        w.querySelectorAll('.qq .grp').forEach(function (x) { x.classList.remove('on'); });
        el.classList.add('on');
        var g = QQ_GROUPS[el.getAttribute('data-g')];
        var h = '<div class="hdr">' + g.name + '（12）</div><div class="msgs"><div class="sys">— 以下是群聊记录 —</div>';
        g.msgs.forEach(function (m) {
          h += '<div class="m"><div class="who2">' + m.who + '</div>' + m.t + '</div>';
        });
        h += '</div>';
        main2.innerHTML = h;
      });
    });
  }
  if (k === 'browser') {
    var page = w.querySelector('.page');
    w.querySelectorAll('.bm span').forEach(function (el) {
      el.addEventListener('click', function () {
        page.innerHTML = PAGES[el.getAttribute('data-p')] || PAGES.home;
      });
    });
  }
  if (k === 'mail') {
    var prev = w.querySelector('.ml .preview');
    var list = w.querySelector('.ml .list');
    function showFolder(f) {
      var arr = MAILS[f] || [];
      if (!arr.length) {
        list.innerHTML = '<div class="item"><div class="s">（空）</div></div>';
        prev.innerHTML = '<div class="cap">该文件夹为空。</div>';
        return;
      }
      list.innerHTML = arr.map(function (m, i) {
        return '<div class="item" data-i="' + i + '"><div>' + m.subj + '</div><div class="s">' + m.from + '</div></div>';
      }).join('');
      showMail(arr, 0);
      list.querySelectorAll('.item').forEach(function (it, i) {
        it.addEventListener('click', function () {
          list.querySelectorAll('.item').forEach(function (x) { x.classList.remove('on'); });
          it.classList.add('on');
          showMail(arr, i);
        });
      });
    }
    function showMail(arr, i) {
      var m = arr[i];
      prev.innerHTML = '<div class="pm">' + m.from + '　·　' + m.date + '</div><b>' + m.subj + '</b><br><br>' + m.body.replace(/\n/g, '<br>');
    }
    w.querySelectorAll('.ml .folder').forEach(function (el) {
      el.addEventListener('click', function () {
        w.querySelectorAll('.ml .folder').forEach(function (x) { x.classList.remove('on'); });
        el.classList.add('on');
        showFolder(el.getAttribute('data-f'));
      });
    });
    showFolder('inbox');
  }
  if (k === 'trash') {
    w.querySelectorAll('[data-restore]').forEach(function (b) {
      b.addEventListener('click', function () {
        var row = b.parentNode;
        row.innerHTML = '<span style="color:#1a6b4a;">已还原：' + row.querySelector('span').textContent + '</span>';
      });
    });
  }
  if (k === 'vault') {
    var body = w.querySelector('#vaultBody');
    var btn = w.querySelector('#vaultBtn');
    var pw = w.querySelector('#vaultPw');
    var open = function () {
      if (pw.value.trim() === '0471') {
        body.innerHTML = '给陈默.txt\n\n「小陈，如果有一天你看到这个，说明我没能活着回来。\n\n' +
          '公司有一个『承者簿』，在临床试验中心的服务器里。\n\n' +
          '记住：日期那一栏，从来不是真的日期。」\n\n' +
          '<span class="note">—— 舅舅</span>';
      } else {
        w.querySelector('#vaultMsg').textContent = '密码错误。';
      }
    };
    btn.addEventListener('click', open);
    pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(); });
  }
  if (k === 'audio') {
    var ab = w.querySelector('#audioBtn');
    var rec = w.querySelector('#rec');
    var st2 = w.querySelector('#audioState');
    var LINES = ['（杂音）…我是周明…', '（杂音）如果这段录音有人听到…',
      '三号观察室，那天晚上…', '他们改了我的体检记录…', '…（杂音）…', '不要相信系统里的日期。'];
    ab.addEventListener('click', function () {
      ab.disabled = true; ab.textContent = '■ 播放中';
      var i = 0, sec = 0;
      var timer = setInterval(function () {
        sec++;
        st2.textContent = '00:' + String(sec).padStart(2, '0') + ' / 00:12';
        if (i >= LINES.length) { clearInterval(timer); return; }
        var d2 = document.createElement('div');
        d2.textContent = LINES[i];
        rec.appendChild(d2);
        i++;
      }, 900);
    });
  }
}

/* ================= 窗口内容 ================= */
var WIN = {
  memo: { t: '我的文档', w: 380, html:
    '备忘录.txt\n\n' +

<script>
/* ---- 访问保护 ---- */
(function () {
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
