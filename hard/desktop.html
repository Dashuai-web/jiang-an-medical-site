<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周明的电脑</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; background: #3a6ea5;
         font-family: "Microsoft YaHei", "SimSun", sans-serif; }
  #desktop { position: relative; width: 100%; height: 100%;
             background: linear-gradient(135deg, #3a6ea5 0%, #2f5d8a 100%); padding: 18px; }
  .icon { position: absolute; width: 86px; text-align: center; cursor: pointer; color: #fff;
          text-shadow: 1px 1px 2px rgba(0,0,0,.6); user-select: none; }
  .icon .img { font-size: 34px; line-height: 1; }
  .icon .lb { font-size: 12px; margin-top: 4px; }
  .icon.sel .lb { background: #0a2a4a; outline: 1px dotted #fff; }
  #taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 34px;
             background: #24507d; border-top: 1px solid #1a3f66; display: flex;
             align-items: center; padding: 0 10px; color: #fff; font-size: 12px; }
  #taskbar .start { background: #3a8a3a; padding: 4px 14px; border-radius: 3px; font-weight: bold; }
  #taskbar .clock { margin-left: auto; padding: 0 8px; border-left: 1px solid #1a3f66; }
  .win { position: absolute; background: #ece9d8; border: 2px solid #0a2a4a;
         box-shadow: 3px 3px 0 rgba(0,0,0,.3); min-width: 280px; max-width: 420px; z-index: 10; }
  .win .tb { background: #0a2a4a; color: #fff; padding: 4px 8px; font-size: 12px;
             display: flex; align-items: center; cursor: move; }
  .win .tb .x { margin-left: auto; background: #c33; border: 1px solid #fff; padding: 0 7px; cursor: pointer; }
  .win .ct { padding: 12px 14px; font-size: 13px; color: #222; line-height: 1.9; max-height: 320px; overflow: auto; white-space: pre-wrap; }
  .win .ct .note { color: #7a5a00; }
  .win .ct .del { color: #8a2020; }
  .link { color: #0000cc; text-decoration: underline; cursor: pointer; }
  @media (max-width: 720px) {
    .icon { width: 72px; }
    .win { max-width: 94vw; }
  }
</style>
</head>
<body>
<div id="desktop">
  <div class="icon" style="left:18px; top:16px;" data-w="memo"><div class="img">📄</div><div class="lb">我的文档</div></div>
  <div class="icon" style="left:120px; top:16px;" data-w="trash"><div class="img">🗑️</div><div class="lb">回收站</div></div>
  <div class="icon" style="left:18px; top:140px;" data-w="computer"><div class="img">🖥️</div><div class="lb">我的电脑</div></div>
  <div class="icon" style="left:120px; top:140px;" data-w="backup"><div class="img">📁</div><div class="lb">江安备份</div></div>
</div>
<div id="taskbar">
  <span class="start">开始</span>
  <span style="margin-left:12px;">周明</span>
  <span class="clock" id="clock"></span>
</div>

<script>
var WIN = {
  memo: { t: '备忘录.txt', c: '2024年11月18日 入职\n\n舅舅的工号是 0471。\n\n如果有人看到这份文件，说明我已经不在了。\n\n别报警。去查。' },
  trash: { t: '回收站', c: '一封被删除的邮件（草稿）：\n\n「小陈，如果我出事，去查事故编号 AQ-2022-10-19。\n死亡原因那一栏被人改过。原始报告在观察室，改后的是办公楼三层。」\n\n<span class="del">（该草稿从未发出）</span>' },
  computer: { t: '我的电脑', c: '本地磁盘 (C:)\n  └ 江安\\\n      ├ 备份\\\n      │    └ 旧版入口.txt  ← 见「江安备份」图标\n      └ 员工资料\\\n           └ 已加密，无法打开\n\n<span class="note">提示：旧版系统 v1.9.4 的密码，规则写在服务器配置里。</span>' },
  backup: { t: '江安备份', c: '旧版入口.txt：\n\n「v1.9.4 登录地址，从官网新闻页最底部能进。\n密码 = jianganyiliao + 一个日期。\n那个日期不在任何网页上，要去服务器 /etc/config 里看。」\n\n<span class="note">※ 服务器地址写在舅舅桌上的便签上。</span>' }
};

function openWin(k) {
  var old = document.querySelector('.win');
  if (old) old.remove();
  var d = WIN[k];
  var w = document.createElement('div');
  w.className = 'win';
  w.style.left = (60 + Math.random() * 80) + 'px';
  w.style.top = (40 + Math.random() * 60) + 'px';
  w.innerHTML = '<div class="tb"><span>' + d.t + '</span><span class="x" onclick="this.parentNode.parentNode.remove()">✕</span></div>'
    + '<div class="ct">' + d.c + '</div>';
  document.getElementById('desktop').appendChild(w);
}
document.querySelectorAll('.icon').forEach(function (el) {
  el.addEventListener('click', function () { openWin(el.getAttribute('data-w')); });
});
function tick() {
  var n = new Date();
  document.getElementById('clock').textContent = n.getHours() + ':' + String(n.getMinutes()).padStart(2, '0');
}
tick(); setInterval(tick, 30000);
</script>
</body>
</html>
