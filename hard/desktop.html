<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周明的电脑</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; background: #000;
         font-family: "Microsoft YaHei", "Segoe UI", "SimSun", sans-serif; font-size: 12px; }

  /* ---------- BIOS ---------- */
  #bios { position: fixed; inset: 0; background: #000; color: #c8c8c8;
          font-family: Consolas, monospace; font-size: 13px; line-height: 1.8;
          padding: 40px 48px; z-index: 60; }
  #bios .ln { opacity: 0; transition: opacity .15s; white-space: pre-wrap; }
  #bios .ok { color: #7fb07f; }

  /* ---------- 桌面 ---------- */
  #desktop { position: relative; width: 100%; height: 100%;
             background: linear-gradient(135deg, #3a6ea5 0%, #2f5d8a 100%); display: none; }
  .icon { position: absolute; width: 74px; text-align: center; cursor: pointer; color: #fff;
          text-shadow: 1px 1px 2px rgba(0,0,0,.7); user-select: none; padding: 4px 2px; }
  .icon:hover { background: rgba(255,255,255,.08); }
  .icon .img { font-size: 28px; line-height: 1; }
  .icon .lb { font-size: 11px; margin-top: 4px; }
  #taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 30px;
             background: linear-gradient(#2a5a8a,#1f4a75); border-top: 1px solid #4a7aa8;
             display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 11px; z-index: 40; }
  #taskbar .start { background: linear-gradient(#4a9a3a,#2f7a22); padding: 3px 12px; border-radius: 3px; font-weight: bold; }
  #taskbar .tasks { display: flex; gap: 6px; margin-left: 12px; }
  #taskbar .task { background: #2f6396; border: 1px solid #4a7aa8; padding: 3px 12px; border-radius: 3px; cursor: pointer; max-width: 160px; overflow: hidden; white-space: nowrap; }
  #taskbar .clock { margin-left: auto; padding: 0 8px; border-left: 1px solid #4a7aa8; }

  /* ---------- 窗口 ---------- */
  .win { position: absolute; background: #f0f0f0; border: 1px solid #4a4a4a;
         box-shadow: 2px 2px 12px rgba(0,0,0,.5); display: flex; flex-direction: column;
         max-width: 92vw; z-index: 10; overflow: hidden; }
  .win .tb { position: relative; height: 27px; display: flex; align-items: center;
             padding: 0 80px 0 10px; font-size: 12px; color: #fff; cursor: move;
             user-select: none; background: linear-gradient(#3a6ea5,#24476e); flex: none; }
  .win.max { left: 0 !important; top: 0 !important; width: 100vw !important; height: calc(100vh - 30px) !important; }
  .win .tb.wx { background: linear-gradient(#3a3a3a,#2b2b2b); }
  .win .tb.qq { background: linear-gradient(#5a9fdc,#2f6fb0); }
  .win .tb.ie { background: linear-gradient(#6a9ad5,#3a6a9a); }
  .win .tb.ml { background: linear-gradient(#3f8ad8,#1f5fa8); }
  .win .tb .tbtxt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                    font-weight: bold; letter-spacing: 1px; }
  .win .tb .ctrl { position: absolute; top: 0; right: 0; bottom: 0; display: flex; gap: 0; }
  .win .tb .ctrl span { width: 26px; height: 100%; display: flex; align-items: center; justify-content: center;
                        background: rgba(255,255,255,.16); border-left: 1px solid rgba(255,255,255,.25);
                        font-size: 11px; cursor: pointer; line-height: 1; }
  .win .tb .ctrl span:hover { background: rgba(255,255,255,.35); }
  .win .tb .ctrl span.close { background: #c0392b; }
  .win .tb .ctrl span.close:hover { background: #e04a3a; }
  .win .ct { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .win .ct.plain { padding: 12px 14px; font-size: 13px; color: #222; line-height: 1.9;
                   overflow: auto; white-space: pre-wrap; max-height: 320px; }
  .cap { font-size: 11px; color: #888; }
  .note { color: #7a5a00; }
  .del { color: #8a2020; }
  .win button { font-family: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
                background: #e6e6e6; border: 1px solid #b0b0b0; border-radius: 2px; }
  .win button:hover { background: #d8d8d8; }
  .win input { font-family: inherit; font-size: 12px; padding: 3px 6px;
               border: 1px solid #b0b0b0; }

  /* ---------- 微信 ---------- */
  .wx { display: flex; height: 400px; font-size: 12px; background: #f5f5f5; }
  .wx .side { width: 190px; background: #2e2e2e; display: flex; flex-direction: column; flex: none; }
  .wx .me { display: flex; align-items: center; gap: 8px; padding: 12px 10px; }
  .wx .me .nm { color: #ddd; font-size: 12px; }
  .wx .searchbox { margin: 0 8px 8px; background: #3a3a3a; border-radius: 3px; padding: 3px 6px; color: #888; font-size: 11px; }
  .wx .list { flex: 1; overflow: auto; }
  .wx .item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer; }
  .wx .item:hover { background: #3a3a3a; }
  .wx .item.on { background: #3f3f3f; }
  .wx .item .tx { flex: 1; min-width: 0; }
  .wx .item .t1 { color: #ddd; font-size: 12px; }
  .wx .item .t2 { color: #7a7a7a; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .wx .badge { background: #f03b3b; color: #fff; font-size: 10px; border-radius: 8px; padding: 0 5px; line-height: 14px; }
  .av { width: 26px; height: 26px; border-radius: 3px; background: #3f7fbf; color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
  .av.big { width: 34px; height: 34px; font-size: 13px; }
  .av.g { background: #4a9a5a; }
  .av.o { background: #d08a3a; }
  .av.p { background: #8a6ab8; }
  .wx .main2 { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #f5f5f5; }
  .wx .chathead { height: 40px; display: flex; align-items: center; justify-content: space-between;
                  padding: 0 14px; border-bottom: 1px solid #dcdcdc; font-size: 13px; color: #333; background: #f5f5f5; flex: none; }
  .wx .chathead .dots { color: #999; letter-spacing: 2px; cursor: pointer; }
  .wx .msgs { flex: 1; overflow: auto; padding: 12px 14px; }
  .wx .time { text-align: center; color: #aaa; font-size: 11px; margin: 6px 0 12px; }
  .wx .msg { display: flex; gap: 8px; margin-bottom: 14px; align-items: flex-start; }
  .wx .msg.me { flex-direction: row-reverse; }
  .wx .bubble { position: relative; background: #fff; padding: 7px 10px; border-radius: 4px;
                max-width: 220px; line-height: 1.65; font-size: 12px; color: #222;
                border: 1px solid #e8e8e8; }
  .wx .msg.me .bubble { background: #95ec69; border-color: #8ada5f; }
  .wx .bubble::after { content: ''; position: absolute; top: 10px; left: -5px;
                       border: 5px solid transparent; border-right-color: #fff; border-left: 0; }
  .wx .msg.me .bubble::after { left: auto; right: -5px; border-right: 0; border-left-color: #95ec69; }
  .wx .draft { color: #c0392b; font-size: 10px; margin-top: 3px; }
  .wx .inputbar { border-top: 1px solid #dcdcdc; background: #f5f5f5; flex: none; }
  .wx .tools { padding: 4px 12px; color: #666; letter-spacing: 8px; font-size: 13px; }
  .wx .box2 { padding: 0 12px 6px; }
  .wx .fakeinput { height: 52px; background: #fff; border: 1px solid #e0e0e0; border-radius: 3px;
                   padding: 6px 8px; color: #bbb; font-size: 12px; }
  .wx .sendrow { text-align: right; padding: 0 12px 8px; }
  .wx .sendrow button { background: #f5f5f5; border: 1px solid #dcdcdc; color: #999; padding: 3px 12px; }

  /* ---------- QQ ---------- */
  .qq { display: flex; flex-direction: column; height: 400px; background: #f0f6ff; }
  .qq .top { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
             background: linear-gradient(#e8f2ff,#dcebff); border-bottom: 1px solid #cfe0f5; flex: none; }
  .qq .nm { font-size: 13px; color: #1a4a7a; }
  .qq .st { font-size: 10px; color: #4a9a4a; }
  .qq .body2 { display: flex; flex: 1; min-height: 0; }
  .qq .side { width: 160px; background: #eaf2ff; border-right: 1px solid #cfe0f5; flex: none; }
  .qq .gtitle { padding: 6px 10px; font-size: 11px; color: #6a8aa8; }
  .qq .grp { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; }
  .qq .grp:hover { background: #dbe9ff; }
  .qq .grp.on { background: #cfe2ff; }
  .qq .main2 { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .qq .chathead { height: 36px; display: flex; align-items: center; justify-content: space-between;
                  padding: 0 12px; border-bottom: 1px solid #cfe0f5; background: #f7fbff; font-size: 12px; color: #1a4a7a; flex: none; }
  .qq .msgs { flex: 1; overflow: auto; padding: 10px 12px; background: #f7fbff; }
  .qq .sys { color: #8a9ab0; font-size: 11px; text-align: center; margin-bottom: 10px; }
  .qq .m { display: flex; gap: 8px; margin-bottom: 12px; }
  .qq .m .tx { line-height: 1.7; color: #222; }
  .qq .who2 { color: #1a6bb8; font-size: 11px; margin-bottom: 2px; }
  .qq .inputbar { border-top: 1px solid #cfe0f5; background: #f7fbff; padding: 6px 10px; flex: none; }
  .qq .fakeinput { height: 42px; background: #fff; border: 1px solid #cfe0f5; border-radius: 2px;
                   color: #bbb; padding: 5px 8px; }
  .qq .sendrow { text-align: right; margin-top: 6px; }
  .qq .sendrow button { background: #4a90d9; color: #fff; border: 1px solid #2f6fb0; padding: 3px 16px; }

  /* ---------- 浏览器 ---------- */
  .ie { display: flex; flex-direction: column; height: 430px; background: #fff; }
  .ie .menu { display: flex; gap: 14px; padding: 3px 10px; background: #f4f4f4;
              border-bottom: 1px solid #dcdcdc; font-size: 11px; color: #333; flex: none; }
  .ie .menu span { cursor: default; }
  .ie .tabs { display: flex; gap: 2px; padding: 4px 6px 0; background: #dfe7f0; border-bottom: 1px solid #b8c8d8; flex: none; }
  .ie .tab { background: #fff; border: 1px solid #b8c8d8; border-bottom: none; padding: 3px 14px;
             font-size: 11px; color: #333; border-radius: 3px 3px 0 0; }
  .ie .toolbar { display: flex; align-items: center; gap: 4px; padding: 4px 6px;
                 background: #eef2f6; border-bottom: 1px solid #d8e0e8; flex: none; }
  .ie .tbtn { width: 24px; height: 22px; display: flex; align-items: center; justify-content: center;
              border: 1px solid #c0ccd8; background: #fafcfe; color: #4a6a8a; font-size: 12px; }
  .ie .addr { flex: 1; display: flex; align-items: center; gap: 6px; background: #fff;
              border: 1px solid #a8b8c8; padding: 2px 6px; font-size: 11px; }
  .ie .addr .lbl { color: #6a7a8a; }
  .ie .addr .url { color: #1a4a8a; }
  .ie .go { background: #f0f4f8; border: 1px solid #a8b8c8; padding: 2px 10px; font-size: 11px; }
  .ie .bm { padding: 3px 10px; background: #f4f7fa; border-bottom: 1px solid #dce4ec; font-size: 11px; color: #6a7a8a; flex: none; }
  .ie .bm span { color: #1a4a8a; cursor: pointer; margin-right: 12px; }
  .ie .bm span:hover { text-decoration: underline; }
  .ie .page { flex: 1; overflow: auto; background: #fff; }
  .ie .status { height: 20px; display: flex; align-items: center; justify-content: space-between;
                padding: 0 10px; background: #eef2f6; border-top: 1px solid #d8e0e8; font-size: 10px; color: #6a7a8a; flex: none; }

  .pg-co .h { background: linear-gradient(#1a6b4a,#14553a); color: #fff; padding: 14px 18px; font-size: 16px; letter-spacing: 2px; }
  .pg-co .nav2 { background: #14553a; color: #cfe8d8; padding: 5px 18px; font-size: 11px; }
  .pg-co .bd { padding: 16px 18px; color: #333; line-height: 2; font-size: 12px; }
  .pg-login { padding: 26px 40px; max-width: 340px; }
  .pg-login .ttl { font-size: 15px; color: #1a4a8a; margin-bottom: 16px; }
  .pg-login label { display: block; font-size: 11px; color: #666; margin: 10px 0 4px; }
  .pg-login input { width: 100%; padding: 4px 6px; border: 1px solid #bbb; font-size: 12px; background: #f7f7f7; }
  .pg-login .go { margin-top: 18px; background: #1a6b4a; color: #fff; padding: 6px 26px; font-size: 12px; border: none; border-radius: 2px; }
  .pg-news { padding: 14px 18px; }
  .pg-news .h2 { font-size: 14px; color: #1a6b4a; border-bottom: 2px solid #1a6b4a; padding-bottom: 6px; margin-bottom: 10px; }
  .pg-news ul { margin: 0; padding: 0; }
  .pg-news li { display: flex; justify-content: space-between; font-size: 12px; padding: 7px 0; border-bottom: 1px dotted #ddd; list-style: none; }
  .pg-news li .d { color: #999; font-size: 11px; }

  /* ---------- QQ邮箱 ---------- */
  .ml { display: flex; flex-direction: column; height: 430px; background: #fff; }
  .ml .head { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 14px;
              background: linear-gradient(#3f8ad8,#2f74c0); color: #fff; flex: none; }
  .ml .logo { font-size: 15px; font-weight: bold; letter-spacing: 1px; }
  .ml .searchbar { flex: 1; max-width: 260px; background: rgba(255,255,255,.9); border-radius: 12px;
                   padding: 3px 10px; font-size: 11px; color: #888; }
  .ml .body2 { display: flex; flex: 1; min-height: 0; }
  .ml .side { width: 132px; background: #f7f9fc; border-right: 1px solid #e4e8ee; flex: none; padding-top: 8px; }
  .ml .write { display: block; margin: 0 10px 10px; background: #3f8ad8; color: #fff; border: none;
               padding: 5px 0; width: calc(100% - 20px); border-radius: 2px; cursor: pointer; font-size: 12px; }
  .ml .folder { display: flex; justify-content: space-between; padding: 6px 12px; color: #444; cursor: pointer; font-size: 12px; }
  .ml .folder:hover { background: #eef3fa; }
  .ml .folder.on { background: #e2ecf8; color: #1a4a8a; font-weight: bold; }
  .ml .folder b { color: #c0392b; font-weight: normal; }
  .ml .list { width: 210px; border-right: 1px solid #e4e8ee; overflow: auto; flex: none; }
  .ml .colhead { display: flex; justify-content: space-between; padding: 6px 10px; background: #f7f9fc;
                 border-bottom: 1px solid #e4e8ee; font-size: 11px; color: #888; }
  .ml .item { padding: 8px 10px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
  .ml .item:hover { background: #f4f8fd; }
  .ml .item.on { background: #eaf2fb; }
  .ml .item .s1 { font-size: 12px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ml .item .s2 { font-size: 11px; color: #999; margin-top: 2px; display: flex; justify-content: space-between; }
  .ml .preview { flex: 1; padding: 14px 18px; overflow: auto; min-width: 0; }
  .ml .preview .ph { font-size: 15px; color: #222; margin-bottom: 8px; }
  .ml .preview .pm { font-size: 11px; color: #888; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; }
  .ml .preview .pb { font-size: 12px; line-height: 2; color: #333; }
  .ml .preview .acts { margin-top: 18px; display: flex; gap: 8px; }
  .ml .preview .acts button { background: #f5f7fa; border: 1px solid #d8e0e8; padding: 3px 12px; font-size: 11px; }

  /* ---------- 资源管理器 ---------- */
  .ex { display: flex; flex-direction: column; height: 360px; background: #fff; }
  .ex .menu { display: flex; gap: 12px; padding: 3px 8px; background: #f4f4f4; border-bottom: 1px solid #dcdcdc; font-size: 11px; flex: none; }
  .ex .toolbar { display: flex; gap: 6px; padding: 4px 8px; background: #eef2f6; border-bottom: 1px solid #d8e0e8; font-size: 11px; color: #3a5a7a; flex: none; }
  .ex .toolbar span { border: 1px solid #c8d4e0; background: #fafcfe; padding: 2px 8px; }
  .ex .addrbar { display: flex; align-items: center; gap: 6px; padding: 3px 8px; background: #f7fafc;
                 border-bottom: 1px solid #d8e0e8; font-size: 11px; color: #6a7a8a; flex: none; }
  .ex .addrbar .path { flex: 1; background: #fff; border: 1px solid #c8d4e0; padding: 1px 6px; color: #333; }
  .ex .body2 { display: flex; flex: 1; min-height: 0; }
  .ex .pane { width: 150px; background: #eef4fa; border-right: 1px solid #d8e0e8; padding: 10px; font-size: 11px; color: #33557a; flex: none; }
  .ex .pane b { display: block; margin-bottom: 6px; color: #1a4a7a; }
  .ex .pane div { padding: 2px 0; cursor: default; }
  .ex .files { flex: 1; overflow: auto; }
  .ex .colhead { display: flex; background: #f4f7fa; border-bottom: 1px solid #e0e6ec; font-size: 11px; color: #666; }
  .ex .colhead span { padding: 4px 8px; flex: 1; border-right: 1px solid #e0e6ec; }
  .ex .row { display: flex; border-bottom: 1px solid #f4f6f8; font-size: 12px; color: #222; cursor: default; }
  .ex .row:hover { background: #eaf2fb; }
  .ex .row span { padding: 5px 8px; flex: 1; overflow: hidden; white-space: nowrap; }
  .ex .row .ic3 { width: 20px; flex: none; padding-right: 0; }
  .ex .status { height: 20px; display: flex; align-items: center; padding: 0 10px;
                background: #eef2f6; border-top: 1px solid #d8e0e8; font-size: 10px; color: #6a7a8a; flex: none; }

  .rec { min-height: 18px; line-height: 1.9; }

  /* 服务器（内嵌） */
  .win .ct.frame { padding: 0; overflow: hidden; }
  .win .ct.frame iframe { width: 100%; height: 100%; border: 0; display: block; background: #0a0c0e; }

  /* 记事本 */
  .np { display: flex; flex-direction: column; height: 300px; background: #fff; }
  .np .menu2 { display: flex; gap: 14px; padding: 3px 10px; background: #f4f4f4; border-bottom: 1px solid #d8d8d8; font-size: 11px; color: #333; flex: none; }
  .np textarea { flex: 1; border: none; outline: none; resize: none; padding: 8px 10px;
                 font-family: "Lucida Console", Consolas, monospace; font-size: 12px; line-height: 1.8; color: #222; }
  .np .status2 { height: 20px; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px;
                 background: #f4f4f4; border-top: 1px solid #d8d8d8; font-size: 11px; color: #666; flex: none; }

  /* 开始菜单 */
  #startMenu { position: fixed; left: 6px; bottom: 32px; width: 236px; background: #d4d0c8;
               border: 1px solid #808080; box-shadow: 2px 2px 8px rgba(0,0,0,.45);
               display: none; z-index: 60; font-size: 12px; }
  #startMenu.show { display: flex; }
  #startMenu .col { flex: 1; padding: 4px 0; }
  #startMenu .item2 { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; color: #222; }
  #startMenu .item2:hover, #startMenu .item2.on { background: #2f5d8a; color: #fff; }
  #startMenu .sep { height: 1px; background: #b8b4a8; margin: 4px 8px; }
  #startMenu .band { width: 34px; background: linear-gradient(180deg, #3a6ea5, #24476e); color: #dbe8f5;
                     display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px;
                     writing-mode: vertical-rl; font-size: 11px; letter-spacing: 2px; }
  #smSub { position: fixed; width: 172px; background: #d4d0c8; border: 1px solid #808080;
           display: none; box-shadow: 2px 2px 8px rgba(0,0,0,.45); z-index: 61; }
  #smSub.show { display: block; }
  #smSub .item2 { padding: 6px 12px; cursor: pointer; color: #222; font-size: 12px; }
  #smSub .item2:hover { background: #2f5d8a; color: #fff; }
  #shut { position: fixed; inset: 0; background: #000; color: #d8d8d8; display: none;
          align-items: center; justify-content: center; flex-direction: column; gap: 18px;
          font-family: "Microsoft YaHei"; z-index: 70; text-align: center; }
  #shut.show { display: flex; }
  #shut .big { font-size: 18px; letter-spacing: 2px; }
  #shut .sm { font-size: 12px; color: #888; }
  #shut button { font-size: 12px; padding: 4px 14px; }

  /* 记事本菜单 */
  .np { position: relative; }
  .np .menu2 span { cursor: pointer; padding: 1px 5px; }
  .np .menu2 span:hover, .np .menu2 span.on { background: #2f5d8a; color: #fff; }
  .np-drop { position: absolute; left: 8px; top: 23px; background: #f6f6f6; border: 1px solid #a0a0a0;
             box-shadow: 2px 2px 5px rgba(0,0,0,.35); display: none; z-index: 6; min-width: 148px; font-size: 12px; }
  .np-drop.show { display: block; }
  .np-drop .mi { padding: 5px 24px 5px 12px; color: #222; cursor: pointer; white-space: nowrap; }
  .np-drop .mi:hover { background: #2f5d8a; color: #fff; }
  .np-drop .sep2 { height: 1px; background: #d0d0d0; margin: 3px 0; }

  /* 关于对话框 */
  .np-about { position: absolute; inset: 0; background: rgba(0,0,0,.22); display: flex;
              align-items: center; justify-content: center; z-index: 9; }
  .np-about .box3 { background: #ece9d8; border: 1px solid #333; padding: 16px 18px; width: 292px;
                    box-shadow: 3px 3px 10px rgba(0,0,0,.45); font-size: 12px; color: #222; }
  .np-about img { width: 64px; height: 64px; border: 1px solid #888; float: left;
                  margin: 0 12px 8px 0; cursor: pointer; border-radius: 4px; background: #fff; }

    var MENUS = {

function parentPath(p) {
  if (p === 'C:\\') return 'C:\\';
  var seg = p.split('\\').filter(function (x) { return x !== ''; });
  seg.pop();
  return seg.length <= 1 ? 'C:\\' : seg.join('\\') + '\\';
}

function renderExplorer(w, path, noPush) {
  if (!w._hist) w._hist = [];
  if (!noPush) w._hist.push(path);
  w._path = path;
  var files = w.querySelector('#exFiles');
  var pathEl = w.querySelector('#exPath');
  var status = w.querySelector('#exStatus');
  if (!files) return;
  pathEl.textContent = path;
  var rows = (VFS[path] || []).slice();
  var html = '<div class="colhead"><span style="flex:2">名称</span><span>类型</span><span>修改日期</span></div>';  var list = [];
  if (path !== 'C:\\') list.push({ n: '..', t: 'up' });
  list = list.concat(rows);
  list.forEach(function (e, i) {
    var icon = e.t === 'dir' ? '📁' : (e.t === 'file' ? (e.n.indexOf('.jpg') > 0 ? '🖼️' : (e.n.indexOf('.mp3') > 0 ? '🎵' : '📄')) : '↩');
    var type = e.t === 'dir' ? (e.lock ? '加密文件夹' : '文件夹') : (e.t === 'file' ? '文件' : '上级目录');
    html += '<div class="row" data-i="' + i + '"><span class="ic3">' + icon + '</span>' +
      '<span style="flex:2">' + e.n + '</span><span>' + type + '</span><span>' + (e.d || '') + '</span></div>';
  });
  files.innerHTML = html;
  status.textContent = list.length + ' 个对象　　　　　　　　' + path;

  files.querySelectorAll('.row').forEach(function (row) {
    row.addEventListener('click', function () {
      var e = list[+row.getAttribute('data-i')];
      if (!e) return;
      if (e.t === 'up') { renderExplorer(w, parentPath(path)); return; }
      if (e.t === 'dir') {
        if (e.lock) { askLock(w, e); return; }
        renderExplorer(w, e.go);
      } else {
        openWin(e.open);
      }
    });
  });
}

  }, true);

    if (frozen) return;

  }, 1500);
})();
