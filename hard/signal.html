<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信号</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c0c0c; color: #8a8a8a; font-family: "Microsoft YaHei", monospace; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 60px 18px; text-align: center; }
  .label { font-size: 12px; letter-spacing: 3px; color: #4a4a4a; margin-bottom: 30px; }
  .lamp { width: 110px; height: 110px; margin: 0 auto 30px; border-radius: 50%;
          background: #1a0606; border: 2px solid #2a0a0a; cursor: pointer;
          transition: background .1s, box-shadow .1s; }
  .lamp.playing { background: #7a1212; box-shadow: 0 0 30px rgba(180,30,30,.5); }
  .hint { font-size: 13px; color: #777; line-height: 2; }
  .hint b { color: #a05050; }
  .status { font-size: 11px; color: #555; margin-top: 14px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">— 老式收音机 · 只剩一点红光 —</div>
  <div class="lamp" id="lamp" title="点击播放"></div>
  <div class="hint">
    停顿分隔字母。
  </div>
  <div class="status" id="status"></div>
</div>
<script>
var lamp = document.getElementById('lamp');
var statusEl = document.getElementById('status');
// S I X
var seq = [
  ['dot','dot','dot'], ['dot','dot'], ['dash','dot','dot','dash']
];

var audioCtx = null;
var playing = false;

lamp.addEventListener('click', function () {
  if (playing) return;
  playing = true;
  lamp.className = 'lamp playing';
  statusEl.textContent = '正在播放……';
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  var t0 = audioCtx.currentTime;
  var off = 0;
  var total = 0;
  seq.forEach(function (letter, li) {
    letter.forEach(function (sym) {
      var dur = sym === 'dot' ? 0.2 : 1.0;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 700;
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.2, t0 + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t0 + off);
      o.stop(t0 + off + dur + 0.02);
      off += dur + 0.26;
    });
    off += 0.54;
  });
  total = off * 1000;
  setTimeout(function () {
    playing = false;
    lamp.className = 'lamp';
    statusEl.textContent = '播完了。可以再点一次。';
  }, total + 200);
});
</script>
<script>
/* ---- 访问保护 ---- */
(function () {
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
</body>
</html>
