<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泛黄的纸张</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e8e2d0; color: #333; font-family: "SimSun", serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 30px 14px 60px; }
  .hd { text-align: center; font-size: 13px; color: #7a7461; margin-bottom: 22px; }
  .paper { background: #f7f2e2; border: 1px solid #c9c2a8; box-shadow: 0 2px 8px rgba(0,0,0,.12);
           padding: 20px; margin-bottom: 20px; }
  .paper .cap { font-size: 12px; color: #8a8471; margin-bottom: 12px; text-align: center; }
  .paper svg { width: 100%; height: auto; display: block; }
  .hint { font-size: 11px; color: #9a9380; text-align: center; line-height: 2; }

  @media (max-width: 720px) {
    body { -webkit-text-size-adjust: 100%; }
    .wrap { padding: 20px 12px 44px !important; }
    table { font-size: 11px; }
    th, td { padding: 4px 6px; }
    .item { padding: 12px; }
    .box { padding: 24px 18px !important; }
    .win { max-width: 92vw !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">舅舅留下的几张纸。放大了看。</div>

  <div class="paper">
    <div class="cap">① 招聘启事</div>
    <svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="招聘启事">
      <rect x="0" y="0" width="640" height="420" fill="#faf6ea"/>
      <text x="320" y="52" font-size="30" text-anchor="middle" font-family="SimHei,sans-serif" fill="#8a2020">招 聘 启 事</text>
      <text x="60" y="100" font-size="16" fill="#333">因业务发展需要，江安医药科技有限公司现面向社会招聘：</text>
      <text x="60" y="140" font-size="16" fill="#333">一、临床试验中心 · 行政助理（实习生）2 名</text>
      <text x="60" y="170" font-size="16" fill="#333">二、药物研究院 · 制剂研究员 3 名</text>
      <text x="60" y="200" font-size="16" fill="#333">三、质量与注册部 · QA 专员 1 名</text>
      <text x="60" y="240" font-size="14" fill="#555">要求：18-45 岁，身体健康，无重大疾病史。入职须参加统一体检。</text>
      <text x="60" y="270" font-size="14" fill="#555">报名方式：简历投递至 hr@jiangan-pharma.com</text>
      <!-- 日期水印：低对比度，需放大 -->
      <text x="320" y="340" font-size="12" text-anchor="middle" fill="#f0ecdc" opacity="0.9">发布日期：2024年10月__日</text>
      <text x="320" y="360" font-size="11" text-anchor="middle" fill="#f1eddd" opacity="0.9">JIANGAN PHARMA · 招聘专用章</text>
      <circle cx="540" cy="330" r="46" fill="none" stroke="#c0392b" stroke-width="3" opacity="0.7"/>
      <text x="540" y="326" font-size="13" text-anchor="middle" fill="#c0392b" opacity="0.7">江安</text>
      <text x="540" y="344" font-size="13" text-anchor="middle" fill="#c0392b" opacity="0.7">医药</text>
      <text x="540" y="362" font-size="11" text-anchor="middle" fill="#c0392b" opacity="0.7">人事</text>
      <text x="540" y="380" font-size="10" text-anchor="middle" fill="#c0392b" opacity="0.75">28</text>
    </svg>
  </div>

  <div class="paper">
    <div class="cap">② 员工工牌（正面）</div>
    <svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="工牌 工号0471 周明">
      <rect x="0" y="0" width="640" height="400" fill="#e9eef5"/>
      <rect x="60" y="60" width="520" height="280" fill="#ffffff" stroke="#1a4a8a" stroke-width="3"/>
      <rect x="60" y="60" width="520" height="56" fill="#1a4a8a"/>
      <text x="320" y="96" font-size="24" text-anchor="middle" fill="#ffffff" font-family="SimHei,sans-serif">江安医药科技有限公司</text>
      <text x="120" y="180" font-size="18" fill="#333">姓名：周 明</text>
      <text x="120" y="220" font-size="18" fill="#333">部门：行政部</text>
      <text x="120" y="260" font-size="18" fill="#333">工号：<tspan fill="#a00" font-weight="bold">0471</tspan></text>
      <text x="120" y="300" font-size="13" fill="#888">发证日期：2019-03-01</text>
      <rect x="440" y="150" width="120" height="150" fill="#ddd"/>
      <text x="500" y="235" font-size="13" text-anchor="middle" fill="#999">照片</text>
    </svg>
  </div>

  <div class="hint">如果有些字看不清——放大。图片比想象中更容易被"看见"。</div>
</div>
<script>
/* ---- 访问保护 ---- */
(function () {
  var hits = 0, frozen = false;
  function overlay(msg) {
    var o = document.getElementById('dwGuard');
    if (!o) {
      o = document.createElement('div');
      o.id = 'dwGuard';
      o.style.cssText = 'position:fixed;inset:0;background:rgba(24,0,0,.95);color:#e6c4c4;z-index:2147483000;'
        + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;'
        + 'font-family:SimSun,宋体,serif;font-size:15px;line-height:2.1;';
      document.body.appendChild(o);
    }
    o.innerHTML = msg;
  }
  function mark() {
    hits++;
    if (hits === 1) overlay('检测到调试工具。<br>本次会话已被记录。<br><span style="font-size:12px;color:#8a6a6a;">关闭调试工具后刷新页面</span>');
    if (hits >= 3) { frozen = true; overlay('会话已终止。<br><span style="font-size:12px;color:#8a6a6a;">你已经看得够多了。</span>'); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toUpperCase();
    if (k === 'F12'
      || (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C'))
      || (e.ctrlKey && (k === 'U' || k === 'S'))
      || (e.metaKey && e.altKey && k === 'I')) {
      e.preventDefault(); e.stopPropagation(); mark();
    }
  }, true);
  setInterval(function () {
    if (frozen) return;
    var t = performance.now();
    try { (function () { debugger; })(); } catch (e) {}
    if (performance.now() - t > 150) mark();
  }, 1500);
})();
</script>
</body>
</html>
