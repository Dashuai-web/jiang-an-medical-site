<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职场匿名区 - 求职交流论坛</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; font-size: 14px; color: #333; background: #f0f0f0; margin: 0; padding: 0; }
  .top { background: #2b579a; color: #fff; padding: 10px 0; }
  .top-inner { max-width: 860px; margin: 0 auto; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 18px; font-weight: bold; }
  .top-right a { color: #cfe0f5; text-decoration: none; margin-left: 16px; font-size: 13px; cursor: pointer; }
  .search-wrap { background: #fff; border-bottom: 1px solid #ddd; }
  .search-inner { max-width: 860px; margin: 0 auto; padding: 14px; display: flex; }
  .search-inner input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid #ccc; font-size: 14px; font-family: inherit; }
  .search-inner button { padding: 7px 22px; border: 1px solid #2b579a; background: #2b579a; color: #fff; font-size: 14px; cursor: pointer; margin-left: 6px; }
  .main { max-width: 860px; margin: 16px auto; display: flex; gap: 16px; padding: 0 14px; }
  .left { flex: 1; background: #fff; border: 1px solid #ddd; min-width: 0; }
  .right { width: 240px; flex-shrink: 0; }
  .panel-title { background: #f4f4f4; border-bottom: 1px solid #ddd; padding: 8px 14px; font-weight: bold; font-size: 13px; }
  .board-list { list-style: none; margin: 0; padding: 0; }
  .board-list li { padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 14px; }
  .board-list li:last-child { border-bottom: none; }
  .board-list li a { color: #2b579a; text-decoration: none; display: block; }
  .board-list li a.active { font-weight: bold; }
  .thread { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
  .thread:last-child { border-bottom: none; }
  .thread a { color: #333; text-decoration: none; font-size: 14px; }
  .thread a:hover { color: #2b579a; }
  .thread .meta { font-size: 12px; color: #999; margin-top: 3px; }
  .side-box { background: #fff; border: 1px solid #ddd; margin-bottom: 14px; }
  .side-box .body { padding: 10px 14px; font-size: 12px; color: #666; line-height: 1.9; }
  .login-mask { position: fixed; inset: 0; background: rgba(20,30,45,.92); display: none; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
  .login-mask.show { display: flex; }
  .login-card { background: #fff; padding: 30px 26px; max-width: 340px; width: 100%; text-align: center; border-radius: 4px; }
  .login-card h3 { margin: 0 0 10px; font-size: 17px; color: #2b579a; }
  .login-card p { font-size: 13px; color: #888; line-height: 1.8; margin: 0 0 18px; }
  .login-card button { padding: 9px 40px; background: #2b579a; color: #fff; border: none; border-radius: 3px; font-size: 14px; cursor: pointer; }
  .login-card .note { font-size: 11px; color: #bbb; margin-top: 12px; }
  .login-toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: rgba(30,40,55,.94); color: #fff; padding: 14px 30px; border-radius: 3px; font-size: 15px; letter-spacing: 1px; z-index: 100; display: none; transition: opacity .6s; }
  @media (max-width: 720px) {
    .main { display: block; margin: 10px auto; padding: 0 10px; }
    .right { width: auto; margin-top: 14px; }
    .top-inner { padding: 0 10px; }
    .search-inner { padding: 10px; }
    .logo { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="top-inner">
    <div class="logo">职场匿名区</div>
    <div class="top-right"><a id="loginLink">登录</a><a>注册</a></div>
  </div>
</div>
<div class="search-wrap">
  <div class="search-inner">
    <input id="searchInput" type="text" placeholder="搜索公司名、讨论区、用户ID...">
    <button id="searchBtn">搜索</button>
  </div>
</div>
<div class="main">
  <div class="left">
    <div class="panel-title">版块</div>
    <ul class="board-list" id="boards">
      <li><a href="forum.html" data-b="all">全部</a></li>
      <li><a href="forum.html?b=job" data-b="job">求职经验</a></li>
      <li><a href="forum.html?b=company" data-b="company">公司评价</a></li>
      <li><a href="forum.html?b=industry" data-b="industry">行业讨论</a></li>
      <li><a href="forum.html?b=leak" data-b="leak">匿名爆料</a></li>
    </ul>
    <div class="panel-title" style="border-top:1px solid #ddd;" id="listTitle">最新帖子</div>
    <div id="threadList"></div>
  </div>
  <div class="right">
    <div class="side-box">
      <div class="panel-title">论坛须知</div>
      <div class="body">本论坛为匿名交流区。<br>发帖请勿涉及未公开信息。<br>违规内容将被封禁。</div>
    </div>
    <div class="side-box">
      <div class="panel-title">当前在线</div>
      <div class="body">游客 214 人<br>注册用户 38 人</div>
    </div>
  </div>
</div>

<div class="login-mask" id="loginMask">
  <div class="login-card">
    <h3>职场匿名区</h3>
    <p>浏览需先登录。<br>匿名登录，无需账号密码。</p>
    <button onclick="forumLogin()">登录</button>
    <div class="note">登录即表示同意《匿名区使用条款》</div>
  </div>
</div>
<div class="login-toast" id="loginToast">欢迎回来，陈默！</div>

<script>
var THREADS = [
  { id: 'overtime', t: '面试被问能不能接受加班，怎么回？', b: 'job', r: 8, d: '2小时前' },
  { id: 'bigcity', t: '应届生第一份工作选大厂还是小公司？', b: 'job', r: 21, d: '3小时前' },
  { id: 'resign', t: '离职被卡流程，求助', b: 'job', r: 5, d: '5小时前' },
  { id: 'probation', t: '试用期被辞退，有赔偿吗？', b: 'job', r: 12, d: '昨天' },
  { id: 'excel', t: '简历上写“精通Excel”会被问什么？', b: 'job', r: 7, d: '昨天' },
  { id: 'physical', t: '入职体检一般查什么？', b: 'job', r: 4, d: '昨天' },
  { id: 'noncompete', t: '公司要求签竞业协议，正常吗？', b: 'job', r: 9, d: '2天前' },
  { id: 'biotech', t: '有没有人面过杭州瑞和生物？', b: 'company', r: 3, d: '2天前' },
  { id: 'inteviewJiangAn', t: '江安医药面试流程分享', b: 'company', r: 3, d: '2023-06-12' },
  { id: 'offerJiangAn', t: '江安医药的offer值得去吗？', b: 'company', r: 8, d: '2023-11-02' },
  { id: 'admin', t: '江安医药内部系统管理员账号（付费）', b: 'leak', r: 5, d: '2023-11-05', url: 'admin.html' },
  { id: 'account', t: '有没有人知道江安医药内部系统的账号怎么搞？', b: 'leak', r: 6, d: '2023-06-12', url: 'account.html' },
  { id: 'askZhou', t: '有没有人认识江安医药的老周？', b: 'leak', r: 5, d: '2024-11-09', url: 'ask.html' }
];
var BOARD_NAME = { all: '最新帖子', job: '求职经验', company: '公司评价', industry: '行业讨论', leak: '匿名爆料' };

function qs(k) {
  var m = location.search.substring(1).split('&');
  for (var i = 0; i < m.length; i++) {
    var p = m[i].split('=');
    if (decodeURIComponent(p[0]) === k) return decodeURIComponent(p[1] || '');
  }
  return '';
}
var board = qs('b') || 'all';
var list = document.getElementById('threadList');
var out = '';
for (var i = 0; i < THREADS.length; i++) {
  var th = THREADS[i];
  if (board !== 'all' && th.b !== board) continue;
  var href = th.url ? th.url : ('thread.html?t=' + th.id);
  out += '<div class="thread"><a href="' + href + '">' + th.t + '</a>'
    + '<div class="meta">' + th.r + '回复 · ' + th.d + '</div></div>';
}
list.innerHTML = out || '<div class="thread" style="color:#999;">该版块暂无帖子。</div>';
document.getElementById('listTitle').textContent = BOARD_NAME[board] || '最新帖子';
var bl = document.querySelectorAll('#boards a');
for (var j = 0; j < bl.length; j++) {
  if (bl[j].getAttribute('data-b') === board) bl[j].className = 'active';
}

function go() {
  var v = document.getElementById('searchInput').value.replace(/^\s+|\s+$/g, '');
  if (v === '') return;
  window.location.href = 'search.html?q=' + encodeURIComponent(v);
}
document.getElementById('searchBtn').addEventListener('click', go);
document.getElementById('searchInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });

var LOGIN_KEY = 'cm_forum_login';
function isLogged() { try { return localStorage.getItem(LOGIN_KEY) === '1'; } catch (e) { return false; } }
function forumLogin() {
  try { localStorage.setItem(LOGIN_KEY, '1'); } catch (e) {}
  closeMask();
}
function closeMask() {
  var mask = document.getElementById('loginMask');
  if (mask) mask.className = 'login-mask';
  var t = document.getElementById('loginToast');
  if (t) { t.style.display = 'block'; setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.style.display = 'none'; }, 700); }, 2400); }
}
document.getElementById('loginLink').addEventListener('click', function () {
  if (isLogged()) { closeMask(); } else { document.getElementById('loginMask').className = 'login-mask show'; }
});
if (!isLogged()) document.getElementById('loginMask').className = 'login-mask show';
</script>
</body>
</html>
